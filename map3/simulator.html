  /* ============ 像素风基础 ============ */
  :root{
    --bg:#0b1220; --bg2:#0f1a2e; --panel:#121f38; --panel2:#16253f;
    --line:#264064; --ink:#dbe7f5; --dim:#8aa2c0; --dim2:#5f7796;
    --cat:#5fd3c4; --rat:#e0567a; --gold:#f2c14e; --good:#6ee7a8; --mid:#f2c14e; --bad:#ef6b7f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:18px 18px 40px; background:
      linear-gradient(180deg,#07101d,#0b1220 40%,#0b1220);
    color:var(--ink);
    font-family:"HYPixel",ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
    font-size:13px; line-height:1.55; letter-spacing:.2px;
  }
  h1,h2,h3{margin:0; font-weight:700}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px;
    border-bottom:2px solid var(--line);padding-bottom:10px}
  header h1{font-size:20px;letter-spacing:2px}
  header .tag{font-size:11px;color:#08131f;background:var(--cat);padding:2px 7px;font-weight:700}
  header .sub{color:var(--dim);font-size:11.5px}
  .grid{display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(320px,1fr);gap:14px}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 0 0 2px #0a1425 inset}
  .panel > h2{font-size:12.5px;letter-spacing:1.5px;padding:8px 10px;background:var(--panel2);
    border-bottom:2px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .panel .body{padding:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .row:last-child{margin-bottom:0}
  label.ctl{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);
    background:#0d1728;border:2px solid var(--line);padding:4px 8px}
  label.ctl b{color:var(--gold);min-width:20px;text-align:right}
  input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:8px;background:#22314c;
    border:1px solid var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:16px;background:var(--cat);border:0;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:10px;height:16px;background:var(--cat);border:0;cursor:pointer}
  button{
    font:inherit;font-size:12px;color:var(--ink);background:#1b2b47;cursor:pointer;
    border:2px solid var(--line);padding:6px 11px;transition:.08s;letter-spacing:.5px;
  }
  button:hover{background:#24385c;border-color:#3a5c8c}
  button:active{transform:translate(1px,1px)}
  button.primary{background:var(--cat);color:#07131d;border-color:#7fe3d6;font-weight:700}
  button.primary:hover{background:#7fe3d6}
  button.ghost{background:#16233a}
  button.mini{padding:2px 7px;font-size:11px}
  button.spd.on{background:var(--gold);color:#231a05;border-color:#f7d888;font-weight:700}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* ============ 角色卡 ============ */

 *   敌人（杂兵）使用同一套系统与公式，仅基础值更低、技能倍率更保守。

    def: 0.085,  // L20 ≈ L1 × 2.615
    spd: 0.050,  // L20 ≈ L1 × 1.950
    crit: 0.0025 // 每级 +0.25% 暴击

    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  M3.rng = mulberry32;

  var STATUS_LABEL = {
    atkUp: '攻击↑', atkDown: '攻击↓', defUp: '防御↑', defDown: '防御↓',
    spdUp: '速度↑', spdDown: '速度↓', critUp: '暴击↑', dodge: '闪避↑',
    vuln: '易伤', shield: '护盾', stun: '晕眩', taunt: '嘲讽',
    burn: '灼烧', poison: '中毒', regen: '回春', counter: '反击'
  };
  var NEGATIVE = { atkDown: 1, defDown: 1, spdDown: 1, vuln: 1, stun: 1, burn: 1, poison: 1 };
  M3.STATUS_LABEL = STATUS_LABEL;

  var DEF_K = 50;          // 防御换算常数
  var CRIT_DMG_BASE = 1.5;
  var EN_MAX = 100, EN_BASIC = 20, EN_HIT = 8;
  /* 全局平衡旋钮：enemyStatScale 同时充当后续“要塞难度”的调节阀 */
  M3.tuning = { enemyStatScale: 0.92 };
  var MAX_TICKS = 700;

  /* ---------------------------- 单位实例化 ---------------------------- */
  function collectMod(def) {
    var mod = {
      atkPct: 0, defPct: 0, spdPct: 0, hpPct: 0, critAdd: 0, critDmgAdd: 0,
      dmgTaken: 0, defPen: 0, dodge: 0, lifesteal: 0, healUp: 0, dotTaken: 0, rampAtk: null
    };
    (def.passives || []).forEach(function (p) {
      if (!p.stat) return;
      Object.keys(p.stat).forEach(function (k) {
        if (k === 'rampAtk') mod.rampAtk = p.stat[k];
        else if (k in mod) mod[k] += p.stat[k];
      });
    });
    return mod;
  }

  M3.makeUnit = function (def, level, side) {
    var s = M3.statAt(def.base, level);
    if (side === 'rat') {
      var k = (M3.tuning && M3.tuning.enemyStatScale) || 1;
      s.hp = Math.round(s.hp * k);
      s.atk = Math.round(s.atk * k * 10) / 10;
      s.def = Math.round(s.def * k * 10) / 10;
    }
    var mod = collectMod(def);
    var maxHp = Math.round(s.hp * (1 + mod.hpPct));
    return {
      uid: side + ':' + def.id, def: def, side: side,
      name: def.name, title: def.title || def.name, role: def.role, color: def.color,
      level: level, base: s, mod: mod,
      maxHp: maxHp, hp: maxHp,
      critDmg: CRIT_DMG_BASE + mod.critDmgAdd,
      en: 0, enMax: EN_MAX, gauge: 0, haste: 0, dead: false,
      statuses: [], usedOnce: {},
      stats: { dealt: 0, taken: 0, healed: 0, kills: 0, crits: 0 }
    };
  };

  /* ---------------------------- 动态属性计算 ---------------------------- */
  function statusSum(u, id) {
    var v = 0;
    for (var i = 0; i < u.statuses.length; i++) if (u.statuses[i].id === id) v += (u.statuses[i].value || 0);
    return v;
  }
  function hasStatus(u, id) {
    for (var i = 0; i < u.statuses.length; i++) if (u.statuses[i].id === id) return true;
    return false;
  }
  function effAtk(u) {
    var v = u.base.atk * (1 + u.mod.atkPct + statusSum(u, 'atkUp') - statusSum(u, 'atkDown'));
    if (u.mod.rampAtk) {
      var lost = 1 - u.hp / u.maxHp;
      v *= 1 + Math.min(u.mod.rampAtk[1], lost * u.mod.rampAtk[0]);
    }
    return Math.max(1, v);
  }
  function effDef(u) {
    return Math.max(0, u.base.def * (1 + u.mod.defPct + statusSum(u, 'defUp') - statusSum(u, 'defDown')));
  }
  function effSpd(u) {
    return Math.max(1, u.base.spd * (1 + u.mod.spdPct + statusSum(u, 'spdUp') - statusSum(u, 'spdDown')));
  }
  function effCrit(u) {
    return Math.max(0, Math.min(0.95, u.base.crit + u.mod.critAdd + statusSum(u, 'critUp')));
  }
  function effDodge(u) {
    return Math.max(0, Math.min(0.6, u.mod.dodge + statusSum(u, 'dodge')));
  }
  M3.eff = { atk: effAtk, def: effDef, spd: effSpd, crit: effCrit, dodge: effDodge };

  /* ------------------------------ 战场上下文 ------------------------------ */
  function makeCtx(playerUnits, enemyUnits, seed, logging) {
    return {
      rnd: mulberry32(seed || 1), log: logging !== false,
      units: playerUnits.concat(enemyUnits), ev: [], tickCount: 0, turnNo: 0,
      get cats() { return playerUnits; },
      get rats() { return enemyUnits; }
    };
  }
  function alive(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) if (!list[i].dead) out.push(list[i]);
    return out;
  }
  function enemiesOf(ctx, u) { return u.side === 'cat' ? ctx.rats : ctx.cats; }
  function alliesOf(ctx, u) { return u.side === 'cat' ? ctx.cats : ctx.rats; }

  function push(ctx, e) { if (ctx.log) ctx.ev.push(e); }

  /* -------------------------------- 条件 -------------------------------- */
  function hpPct(u) { return u.hp / u.maxHp; }
  function checkCond(cond, u, ctx, tgt) {
    if (!cond) return true;
    var v = cond.v;
    switch (cond.c) {
      case 'always': return true;
      case 'selfHpBelow': return hpPct(u) < v;
      case 'selfHpAbove': return hpPct(u) > v;
      case 'allyHpBelow': {
        return alive(alliesOf(ctx, u)).some(function (a) { return hpPct(a) < v; });
      }
      case 'targetHpBelow': {
        var t = tgt || ctx.lastTarget;
        return !!t && !t.dead && hpPct(t) < v;
      }
      case 'enemyCountGE': return alive(enemiesOf(ctx, u)).length >= v;
      case 'enemiesWithDot': {
        return alive(enemiesOf(ctx, u)).some(function (e) {
          return e.statuses.some(function (s) { return s.dot; });
        });
      }
      case 'turnLE': return ctx.turnNo <= v;
      default: return true;
    }
  }

  /* ------------------------------ 目标选择 ------------------------------ */
  function pickTauntTargets(ctx, u) {
    var es = alive(enemiesOf(ctx, u)).filter(function (e) { return hasStatus(e, 'taunt'); });
    return es;
  }
  function lowestHp(list) {
    var best = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].dead) continue;
      if (!best || hpPct(list[i]) < hpPct(best)) best = list[i];
    }
    return best;
  }
  function highestAtk(list) {
    var best = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].dead) continue;
      if (!best || effAtk(list[i]) > effAtk(best)) best = list[i];
    }
    return best;
  }
  function lowestEnergy(list) {
    var best = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].dead) continue;
      if (!best || list[i].en < best.en) best = list[i];
    }
    return best;
  }
  function pickTargets(sel, u, ctx) {
    var foes = alive(enemiesOf(ctx, u));
    var mates = alive(alliesOf(ctx, u));
    var taunts = (sel === 'one' || sel === 'oneHighestAtk') ? pickTauntTargets(ctx, u) : [];
    switch (sel) {
      case 'all': return foes;
      case 'random': return foes.length ? [foes[Math.floor(ctx.rnd() * foes.length)]] : [];
      case 'oneHighestAtk':
        if (taunts.length) return [lowestHp(taunts)];
        return highestAtk(foes) ? [highestAtk(foes)] : [];
      case 'self': return [u];
      case 'allAllies': return mates;
      case 'lowestAlly': return lowestHp(mates) ? [lowestHp(mates)] : [];
      case 'lowestEnergyAlly': return lowestEnergy(mates) ? [lowestEnergy(mates)] : [];
      case 'attacker': return ctx.attacker && !ctx.attacker.dead ? [ctx.attacker] : [];
      case 'lastHit': return ctx.lastTarget && !ctx.lastTarget.dead ? [ctx.lastTarget] : (foes.length ? [foes[0]] : []);
      case 'randomEnemy': return foes.length ? [foes[Math.floor(ctx.rnd() * foes.length)]] : [];
      case 'one':
      default:
        if (taunts.length) return [lowestHp(taunts)];
        return lowestHp(foes) ? [lowestHp(foes)] : [];
    }
  }

  /* -------------------------------- 伤害 -------------------------------- */
  function damageModFromTriggers(src, tgt, ctx) {
    var mult = 1;
    (src.def.passives || []).forEach(function (p) {
      (p.triggers || []).forEach(function (tr) {
        if (tr.on !== 'onBeforeDamage') return;
        if (!checkCond(tr.cond, src, ctx, tgt)) return;
        if (tr.effect.kind === 'damageMod') mult *= tr.effect.value;
      });
    });
    return mult;
  }

  function dealDamage(src, tgt, step, ctx, opts) {
    opts = opts || {};
    var ev = { t: 'damage', src: src.uid, tid: tgt.uid, crit: false, dodged: false };
    if (!src || !tgt || tgt.dead || src.dead) return 0;

    /* 闪避（固定伤害与灼烧/中毒不吃闪避） */
    if (!opts.trueDamage && !opts.noDodge && effDodge(tgt) > 0 && ctx.rnd() < effDodge(tgt)) {
      ev.dodged = true; push(ctx, ev);
      if (ctx.log) ctx.ev.push({ t: 'miss', tid: tgt.uid });
      return 0;
    }

    var atk = effAtk(src);
    var def = effDef(tgt) * (1 - Math.max(0, Math.min(0.8, src.mod.defPen)));
    var mit = DEF_K / (DEF_K + def);
    var dmg = atk * step.mul * mit;

    dmg *= damageModFromTriggers(src, tgt, ctx);
    if (step.execute && hpPct(tgt) < step.execute.below) dmg *= step.execute.mul;
    if (step.bonusVsStunned && hasStatus(tgt, 'stun')) dmg *= 1 + step.bonusVsStunned;
    dmg *= 1 + statusSum(tgt, 'vuln');
    dmg *= 1 + tgt.mod.dmgTaken;

    var crit = ctx.rnd() < effCrit(src);
    if (crit) { dmg *= src.critDmg; src.stats.crits++; }
    dmg *= 0.94 + ctx.rnd() * 0.12;

    dmg = Math.max(1, Math.round(dmg));
    if (opts.trueDamage) { ev.crit = false; } else { ev.crit = crit; }

    /* 护盾吸收 */
    var absorbed = 0;
    for (var i = 0; i < tgt.statuses.length && dmg > 0; i++) {
      var s = tgt.statuses[i];
      if (s.id !== 'shield' || !s.absorb) continue;
      var take = Math.min(s.absorb, dmg);
      s.absorb -= take; dmg -= take; absorbed += take;
      if (s.absorb <= 0) tgt.statuses.splice(i--, 1);
    }
    if (absorbed) push(ctx, { t: 'absorb', tid: tgt.uid, value: absorbed });

    tgt.hp -= dmg;
    src.stats.dealt += dmg;
    tgt.stats.taken += dmg;
    ev.value = dmg; ev.targetHp = Math.max(0, tgt.hp);
    push(ctx, ev);

    ctx.lastTarget = tgt;
    ctx.attacker = src;

    /* 吸血 */
    var ls = src.mod.lifesteal + (step.lifesteal || 0);
    if (ls > 0 && dmg > 0) healUnit(src, src, Math.round(dmg * ls), ctx, '吸血');

    /* 反击（仅单体攻击触发） */
    if (!opts.trueDamage && !opts.noCounter && alive(enemiesOf(ctx, tgt)).indexOf(src) >= 0) {
      var cval = statusSum(tgt, 'counter');
      if (cval > 0 && !src.dead && !tgt.dead) {
        push(ctx, { t: 'counter', uid: tgt.uid });
        dealDamage(tgt, src, { mul: cval }, ctx, { noCounter: true });
      }
    }

    /* 受击触发 */
    if (!src.dead && !tgt.dead) runTriggers(tgt, 'onTakeDamage', ctx, { attacker: src, lastTarget: tgt });
    return dmg;
  }

  function damageAfterDeath(ctx) {
    /* 死亡结算 + 击杀归属 */
    ctx.units.forEach(function (u) {
      if (!u.dead && u.hp <= 0) {
        u.hp = 0; u.dead = true; u.statuses = [];
        push(ctx, { t: 'death', uid: u.uid });
        var a = ctx.attacker;
        if (a && !a.dead && a.side !== u.side) a.stats.kills++;
      }
    });
  }

  /* 治疗加成：施术者自身 + 该方全体“治疗光环”被动（米娅 / 扳手鼠） */
  function healBonus(src, tgt, ctx) {
    var bonus = src.mod.healUp;
    alliesOf(ctx, tgt).forEach(function (a) { if (a !== src && !a.dead) bonus += a.mod.healUp; });
    return 1 + bonus;
  }

  function healUnit(src, tgt, amount, ctx, label) {
    if (tgt.dead) return 0;
    var heal = Math.round(amount * healBonus(src, tgt, ctx));
    var before = tgt.hp;
    tgt.hp = Math.min(tgt.maxHp, tgt.hp + heal);
    var real = tgt.hp - before;
    src.stats.healed += real;
    push(ctx, { t: 'heal', tid: tgt.uid, value: real, label: label || '治疗' });
    return real;
  }

  /* ------------------------------- 状态施加 ------------------------------- */
  function applyStatus(u, spec, ctx, srcUnit) {
    if (u.dead) return;
    var st = { id: spec.status, value: spec.value || 0, turns: spec.turns || 2, src: srcUnit ? srcUnit.uid : null };
    if (spec.status === 'shield') { st.absorb = spec.absorb || 0; }
    if (spec.stackMax) {
      var same = u.statuses.filter(function (s) { return s.id === spec.status && s.src === st.src; }).length;
      if (same >= spec.stackMax) return;
    }
    u.statuses.push(st);
    push(ctx, {
      t: 'status', tid: u.uid, status: st.id, label: STATUS_LABEL[st.id] || st.id,
      value: st.value, turns: st.turns, absorb: st.absorb || 0
    });
  }

  function applyDot(tgt, id, mul, turns, src) {
    return { status: id, value: Math.round(effAtk(src) * mul), turns: turns };
  }

  /* ------------------------------- 步骤执行 ------------------------------- */
  function executeStep(step, u, ctx) {
    switch (step.kind) {
      case 'damage': {
        var hits = step.hits || 1;
        var total = 0;
        for (var h = 0; h < hits; h++) {
          var tgts = pickTargets(step.target || 'one', u, ctx);
          if (!tgts.length) break;
          for (var i = 0; i < tgts.length; i++) {
            if (tgts[i].dead) continue;
            total += dealDamage(u, tgts[i], step, ctx);
          }
        }
        return total;
      }
      case 'heal': {
        var hs = pickTargets(step.target || 'self', u, ctx);
        for (var j = 0; j < hs.length; j++) healUnit(u, hs[j], effAtk(u) * step.mul, ctx);
        return hs.length;
      }
      case 'shield': {
        var ss = pickTargets(step.target || 'self', u, ctx);
        for (var k = 0; k < ss.length; k++) {
          applyStatus(ss[k], { status: 'shield', absorb: Math.round(effAtk(u) * step.mul), turns: step.turns || 2 }, ctx, u);
        }
        return ss.length;
      }
      case 'status': {
        var ts = pickTargets(step.target || 'one', u, ctx);
        for (var m = 0; m < ts.length; m++) {
          if (step.chance !== undefined && ctx.rnd() > step.chance) {
            push(ctx, { t: 'resist', tid: ts[m].uid, label: STATUS_LABEL[step.status] || step.status });
            continue;
          }
          applyStatus(ts[m], { status: step.status, value: step.value, turns: step.turns, stackMax: step.stackMax }, ctx, u);
        }
        return ts.length;
      }
      case 'dot': {
        var ds = pickTargets(step.target || 'one', u, ctx);
        for (var n = 0; n < ds.length; n++) {
          applyStatus(ds[n], applyDot(ds[n], step.id, step.mul, step.turns || 2, u), ctx, u);
        }
        return ds.length;
      }
      case 'detonate': {
        var xs = pickTargets(step.target || 'one', u, ctx);
        var count = 0;
        xs.forEach(function (x) {
          var stacks = x.statuses.filter(function (s) { return s.dot === step.dotId; }).slice(0, step.maxStacks || 3);
          stacks.forEach(function (s) {
            var dmg = Math.round(effAtk(u) * step.mul);
            push(ctx, { t: 'detonate', tid: x.uid, value: dmg });
            x.hp -= dmg; u.stats.dealt += dmg; x.stats.taken += dmg;
            if (x.hp <= 0) { damageAfterDeath(ctx); }
            count++;
          });
          x.statuses = x.statuses.filter(function (s) { return s.dot !== step.dotId; });
        });
        return count;
      }
      case 'cleanse': {
        var cs = pickTargets(step.target || 'self', u, ctx);
        var removed = 0;
        cs.forEach(function (c) {
          for (var i2 = 0; i2 < c.statuses.length && removed < (step.count || 1); i2++) {
            if (NEGATIVE[c.statuses[i2].id]) { c.statuses.splice(i2, 1); i2--; removed++; }
          }
        });
        push(ctx, { t: 'cleanse', tid: cs.length ? cs[0].uid : null, value: removed });
        return removed;
      }
      case 'energy': {
        var es = pickTargets(step.target || 'self', u, ctx);
        es.forEach(function (e) { e.en = Math.min(e.enMax, e.en + step.amount); });
        push(ctx, { t: 'energy', tid: es.length ? es[0].uid : null, value: step.amount });
        return es.length;
      }
      case 'haste': {
        var target = pickTargets(step.target || 'self', u, ctx)[0] || u;
        target.haste += 1;
        push(ctx, { t: 'haste', tid: target.uid });
        return 1;
      }
      case 'selfHpCost': {
        var cost = Math.round(u.maxHp * step.v);
        u.hp = Math.max(1, u.hp - cost);
        u.stats.taken += cost;
        push(ctx, { t: 'selfcost', uid: u.uid, value: cost });
        return cost;
      }
      case 'damageMod':
        return 0; /* 由 dealDamage 内部读取 */
      default: return 0;
    }
  }

  function runTriggers(u, hook, ctx, extra) {
    if (u.dead) return;
    var old = {};
    if (extra) Object.keys(extra).forEach(function (k) { old[k] = ctx[k]; ctx[k] = extra[k]; });
    (u.def.passives || []).forEach(function (p) {
      (p.triggers || []).forEach(function (tr, idx) {
        if (tr.on !== hook) return;
        var key = p.id + ':' + hook + ':' + idx;
        if (tr.once && u.usedOnce[key]) return;
        if (tr.chance !== undefined && ctx.rnd() > tr.chance) return;
        if (!checkCond(tr.cond, u, ctx, extra && extra.lastTarget)) return;
        if (tr.once) u.usedOnce[key] = 1;
        executeStep(tr.effect, u, ctx);
      });
    });
    if (extra) Object.keys(extra).forEach(function (k) { ctx[k] = old[k]; });
  }

  /* ------------------------------- 技能决策 ------------------------------- */
  function chooseSkill(u, ctx) {
    var best = null;
    function consider(skill, prio) {
      if (!best || prio > best.prio + 1e-9) best = { skill: skill, prio: prio };
    }
    consider(null, 0); /* 普攻，优先级 0 */
    (u.def.ults || []).forEach(function (ult) {
      if (u.en < ult.cost) return;
      var prio = 0;
      if (ult.ai && ult.ai.prio) prio = ult.ai.prio;
      if (ult.ai && ult.ai.cond && !checkCond(ult.ai.cond, u, ctx)) prio = Math.min(prio, 0.5);
      consider(ult, prio);
    });
    return best.skill;
  }

  /* -------------------------------- 行动 -------------------------------- */
  function tickStatuses(u, ctx, phase) {
    for (var i = 0; i < u.statuses.length; i++) {
      var s = u.statuses[i];
      if (phase === 'start') {
        if (s.dot === 'burn' || s.dot === 'poison') {
          var dmg = Math.max(1, Math.round(s.value * (1 + u.mod.dotTaken)));
          u.hp -= dmg; u.stats.taken += dmg;
          push(ctx, { t: 'dot', tid: u.uid, status: s.dot, label: STATUS_LABEL[s.dot], value: dmg });
          if (s.src) { var src = ctx.units.filter(function (x) { return x.uid === s.src; })[0]; if (src) src.stats.dealt += dmg; }
        } else if (s.id === 'regen') {
          var before = u.hp;
          u.hp = Math.min(u.maxHp, u.hp + s.value);
          if (u.hp > before) push(ctx, { t: 'heal', tid: u.uid, value: u.hp - before, label: '回春' });
        }
      }
    }
    damageAfterDeath(ctx);
  }

  function expireStatuses(u, ctx) {
    for (var i = u.statuses.length - 1; i >= 0; i--) {
      var s = u.statuses[i];
      if (s.turns === 99) continue;
      s.turns--;
      if (s.turns <= 0) u.statuses.splice(i, 1);
    }
  }

  function runBasicAttack(u, ctx) {
    var special = null;
    (u.def.passives || []).forEach(function (p) { if (p.triggerSpecial) special = p.triggerSpecial; });
    var steps;
    if (special && special.kind === 'spread' && ctx.rnd() < special.chance) {
      steps = [{ kind: 'damage', mul: special.mul, target: 'all' }];
      push(ctx, { t: 'special', uid: u.uid, label: '散弹装填' });
    } else {
      steps = [{ kind: 'damage', mul: 1.0, target: 'one' }];
    }
    steps.forEach(function (s) { executeStep(s, u, ctx); });
    if (special && special.kind === 'pursuit' && ctx.rnd() < special.chance) {
      push(ctx, { t: 'special', uid: u.uid, label: '追击' });
      executeStep({ kind: 'damage', mul: special.mul || 0.5, target: 'one' }, u, ctx);
    }
  }

  function act(u, ctx) {
    ctx.turnNo++;
    push(ctx, { t: 'turn', uid: u.uid });

    /* 1. 回合开始：持续伤害 / 回春 */
    tickStatuses(u, ctx, 'start');
    if (u.dead) return;

    /* 2. 回合开始触发（被动） */
    runTriggers(u, 'onTurnStart', ctx);
    damageAfterDeath(ctx);
    if (u.dead) return;

    /* 3. 晕眩跳过 */
    if (hasStatus(u, 'stun')) {
      push(ctx, { t: 'skip', uid: u.uid, label: '晕眩' });
    } else {
      var skill = chooseSkill(u, ctx);
      if (skill) {
        u.en -= skill.cost;
        push(ctx, { t: 'skill', uid: u.uid, skill: skill.id, name: skill.name, cost: skill.cost });
        skill.steps.forEach(function (s) { if (!u.dead) executeStep(s, u, ctx); });
      } else {
        push(ctx, { t: 'skill', uid: u.uid, skill: 'basic', name: '普通攻击', cost: 0 });
        runBasicAttack(u, ctx);
        u.en = Math.min(u.enMax, u.en + EN_BASIC);
      }
      runTriggers(u, 'onAttack', ctx);
    }
    damageAfterDeath(ctx);
    if (u.dead) return;

    /* 4. 回合结束触发 + 状态计时 */
    runTriggers(u, 'onTurnEnd', ctx);
    damageAfterDeath(ctx);
    expireStatuses(u, ctx);
  }

  /* -------------------------------- 主循环 -------------------------------- */
  M3.simulate = function (cats, rats, seed, logging) {
    var ctx = makeCtx(cats, rats, seed, logging);
    push(ctx, { t: 'start' });
    var guard = 0;
    while (guard++ < MAX_TICKS * 4) {
      if (!alive(ctx.cats).length || !alive(ctx.rats).length) break;
      var ready = [];
      ctx.units.forEach(function (u) { if (!u.dead && u.gauge >= 100) ready.push(u); });
      if (ready.length) {
        ready.sort(function (a, b) {
          if (b.gauge !== a.gauge) return b.gauge - a.gauge;
          return effSpd(b) - effSpd(a);
        });
        var u2 = ready[0];
        u2.gauge -= 100;
        /* 受击/行动的能量条不变 */
        act(u2, ctx);
        if (u2.haste > 0) { u2.haste--; u2.gauge = 100; }
        continue;
      }
      /* 行动条推进 */
      ctx.units.forEach(function (u) { if (!u.dead) u.gauge += effSpd(u); });
      ctx.tickCount++;
      if (ctx.tickCount > MAX_TICKS) break;
    }

    var catsAlive = alive(ctx.cats).length, ratsAlive = alive(ctx.rats).length;
    var win;
    if (ratsAlive === 0 && catsAlive > 0) win = true;
    else if (catsAlive === 0) win = false;
    else {
      /* 超时：按剩余生命百分比之和判定，平局算我方失利（攻坚失败） */
      var ch = ctx.cats.reduce(function (s, u) { return s + hpPct(u); }, 0);
      var rh = ctx.rats.reduce(function (s, u) { return s + hpPct(u); }, 0);
      win = ch > rh * 1.15;
    }
    push(ctx, { t: 'end', win: win, ticks: ctx.tickCount, turns: ctx.turnNo });
    return {
      win: win, ticks: ctx.tickCount, turns: ctx.turnNo, events: ctx.ev,
      catsAlive: catsAlive, ratsAlive: ratsAlive,
      catHpPct: ctx.cats.reduce(function (s, u) { return s + hpPct(u); }, 0) / ctx.cats.length,
      stats: ctx.cats.map(function (u) { return { uid: u.uid, name: u.title, dealt: u.stats.dealt, healed: u.stats.healed, taken: u.stats.taken, kills: u.stats.kills, crits: u.stats.crits, alive: !u.dead }; })
    };
  };

  /* ------------------------------ 编队相关 ------------------------------ */
  function unitPower(u) {
    var a = effAtk(u);
    return u.maxHp * (1 + effDef(u) / DEF_K) * 0.55 + a * 9 + effSpd(u) * 6 + a * 14 * effCrit(u);
  }
  M3.unitPower = unitPower;

  /* 从池中挑 4 名“势均力敌”的角色：
     · 先随机抽大量候选编队，保留个体战力离散度达标（cv 小）的
     · 再在候选中偏向职业多样性，最后等概率随机取一支
     —— 既保证队内强度接近，又不会每次都是同一批角色 */
  M3.pickBalancedTeam = function (pool, n, rnd, opts) {
    n = n || 4;
    opts = opts || {};
    var r = rnd || Math.random;
    var lv = opts.level || 10;
    var cvMax = opts.cvMax === undefined ? 0.3 : opts.cvMax;
    var powers = pool.map(function (d) { return unitPower(M3.makeUnit(d, lv, 'cat')); });
    var cands = [];
    for (var iter = 0; iter < 500; iter++) {
      var idx = [], used = {}, ok = true;
      while (idx.length < n) {
        var i = Math.floor(r() * powers.length);
        if (used[i]) continue;
        used[i] = 1; idx.push(i);
      }
      var ps = idx.map(function (x) { return powers[x]; });
      var mean = ps.reduce(function (a, b) { return a + b; }, 0) / n;
      var sd = Math.sqrt(ps.reduce(function (a, b) { return a + Math.pow(b - mean, 2); }, 0) / n);
      var cv = sd / mean;
      if (cv > cvMax) continue;
      var roles = {}, dup = 0;
      idx.forEach(function (x) { if (roles[pool[x].role]) dup++; roles[pool[x].role] = 1; });
      cands.push({ idx: idx, cv: cv, dup: dup });
    }
    if (!cands.length) return pool.slice(0, n);
    var minDup = Math.min.apply(null, cands.map(function (c) { return c.dup; }));
    var pool2 = cands.filter(function (c) { return c.dup <= minDup + 1; });
    var pick = pool2[Math.floor(r() * pool2.length)];
    return pick.idx.map(function (i2) { return pool[i2]; });
  };

  M3.rollEnemyTeam = function (level, count, rnd, pool) {
    var r = rnd || Math.random;
    pool = pool || M3.mice;
    var out = [];
    for (var i = 0; i < count; i++) out.push({ def: pool[Math.floor(r() * pool.length)], level: level });
    return out;
  };

  M3.buildUnits = function (teamSpecs, side) {
    return teamSpecs.map(function (t) {
      if (t.uid) return t;                       /* 已是实例 */
      return M3.makeUnit(t.def || t, t.level || 10, side);
    });
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = M3;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ==========================================================================
 * map3 · 猫鼠远洋 —— 战斗模拟器 UI
 * --------------------------------------------------------------------------
 * 只依赖 M3（data.js + engine.js）。全程自动战斗：点击「出击」后逐条回放战报。
 * 像素风 UI，不含角色立绘（按需求不含角色图像）。
 * ========================================================================== */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };

  /* 技能解锁节奏：10 级全解锁（被动1 → 大招1 → 被动2 → 大招2） */
  var UNLOCK = { p1: 1, u1: 5, p2: 10, u2: 15 };
  function skillSlots(def) {
    var out = [];
    (def.passives || []).forEach(function (p, i) {
      out.push({ key: 'p' + (i + 1), kind: 'passive', name: p.name, desc: p.desc, lv: UNLOCK['p' + (i + 1)] });
    });
    (def.ults || []).forEach(function (u, i) {
      out.push({ key: 'u' + (i + 1), kind: 'ult', name: u.name, desc: u.desc, cost: u.cost, lv: UNLOCK['u' + (i + 1)] });
    });
    return out.sort(function (a, b) { return a.lv - b.lv; });
  }

  /* -------------------------------- 状态 -------------------------------- */
  var state = {
    catLv: 10, ratLv: 10, ratN: 4,
    catTeam: [],
    ratTeam: [],
    playing: false, timer: null, speed: 1, evIndex: 0, events: null, result: null,
    live: {}
  };

  /* ------------------------------ 编队卡片 ------------------------------ */
  function catCard(def, lv, compact) {
    var st = M3.statAt(def.base, lv);
    var slots = skillSlots(def).map(function (s) {
      var locked = lv < s.lv;
      return '<li class="slot ' + s.kind + (locked ? ' locked' : '') + '" title="' + esc(s.desc) + '">' +
        '<span class="k">' + (s.kind === 'ult' ? '必杀' : '被动') + '</span>' +
        '<span class="n">' + esc(s.name) + '</span>' +
        '<span class="lv">' + (locked ? '🔒 Lv' + s.lv : (s.cost ? s.cost + 'EN' : '常驻')) + '</span>' +
        '</li>';
    }).join('');
    return '<div class="card" style="--c:' + def.color + '" data-id="' + def.id + '">' +
      '<div class="chead"><span class="glyph">' + esc(def.title.slice(0, 1)) + '</span>' +
      '<div><b>' + esc(def.title) + '</b><i>' + esc(def.role) + ' · Lv' + lv + '</i></div></div>' +
      '<div class="stats">' +
      sbox('HP', st.hp) + sbox('ATK', st.atk) + sbox('DEF', st.def) + sbox('SPD', st.spd) + sbox('CRIT', (st.crit * 100).toFixed(0) + '%') +
      '</div>' +
      (compact ? '' : '<ul class="slots">' + slots + '</ul>') +
      '</div>';
  }
  function sbox(k, v) { return '<span class="sb"><i>' + k + '</i><b>' + v + '</b></span>'; }

  function ratCard(def, lv, compact) {
    var st = M3.statAt(def.base, lv);
    var slots = skillSlots(def).map(function (s) {
      return '<li class="slot ' + s.kind + '" title="' + esc(s.desc) + '"><span class="k">' +
        (s.kind === 'ult' ? '必杀' : '被动') + '</span><span class="n">' + esc(s.name) + '</span></li>';
    }).join('');
    return '<div class="card rat" style="--c:' + def.color + '" data-id="' + def.id + '">' +
      '<div class="chead"><span class="glyph">' + esc(def.name.slice(0, 1)) + '</span>' +
      '<div><b>' + esc(def.name) + '</b><i>' + esc(def.role) + ' · Lv' + lv + '</i></div></div>' +
      '<div class="stats">' + sbox('HP', st.hp) + sbox('ATK', st.atk) + sbox('DEF', st.def) + sbox('SPD', st.spd) + '</div>' +
      (compact ? '' : '<ul class="slots">' + slots + '</ul>') +
      '</div>';
  }

  function renderSetup() {
    $('catTeam').innerHTML = state.catTeam.map(function (d) { return catCard(d, state.catLv, false); }).join('');
    $('ratTeam').innerHTML = state.ratTeam.map(function (t) { return ratCard(t.def, t.level, false); }).join('');
  }

  /* ------------------------------- 战场构建 ------------------------------- */
  function buildArena() {
    state.catTeam.forEach(function (d) { M3.makeUnit(d, state.catLv, 'cat'); }); /* 预热 */
    state.ratTeam = state.ratTeam.map(function (t) { return { def: t.def, level: t.level }; });
    var cats = state.catTeam.map(function (d) { return M3.makeUnit(d, state.catLv, 'cat'); });
    var rats = state.ratTeam.map(function (t) { return M3.makeUnit(t.def, t.level, 'rat'); });
    state.units = cats.concat(rats);
    state.live = {};
    state.units.forEach(function (u) { state.live[u.uid] = u; });

    $('sideCats').innerHTML = cats.map(unitRow).join('');
    $('sideRats').innerHTML = rats.map(unitRow).join('');
    $('log').innerHTML = '';
    $('result').textContent = '';
    $('clock').textContent = '预备';
    return { cats: cats, rats: rats };
  }

  function unitRow(u) {
    return '<div class="unit" id="u_' + u.uid.replace(':', '_') + '" style="--c:' + u.color + '">' +
      '<div class="uhead"><span class="glyph">' + esc((u.title || u.name).slice(0, 1)) + '</span>' +
      '<b>' + esc(u.title || u.name) + '</b><i>Lv' + u.level + '</i></div>' +
      '<div class="hpbar"><div class="hpfill" style="width:100%"></div><span class="hptxt">' + u.maxHp + '/' + u.maxHp + '</span></div>' +
      '<div class="enbar"><i></i></div>' +
      '<div class="chips"></div>' +
      '<div class="pop"></div></div>';
  }
  function el(uid) { return $('u_' + uid.replace(':', '_')); }

  function syncUnit(u) {
    var e = el(u.uid); if (!e) return;
    var pct = Math.max(0, u.hp / u.maxHp * 100);
    e.querySelector('.hpfill').style.width = pct.toFixed(1) + '%';
    e.querySelector('.hpfill').classList.toggle('low', pct < 35);
    e.querySelector('.hptxt').textContent = Math.max(0, Math.round(u.hp)) + '/' + u.maxHp;
    e.querySelector('.enbar i').style.width = (u.en / u.enMax * 100) + '%';
    e.classList.toggle('dead', u.dead);
    e.querySelector('.chips').innerHTML = u.statuses.filter(function (s) { return s.turns !== 99 || s.id === 'shield'; })
      .map(function (s) {
        var lbl = M3.STATUS_LABEL[s.id] || s.id;
        var extra = s.id === 'shield' ? Math.round(s.absorb) : (s.value ? Math.round((s.dot ? s.value : s.value * 100) * 10) / 10 : '');
        return '<span class="chip" title="' + esc(lbl) + '">' + esc(lbl) + (extra !== '' && extra !== 0 ? esc(' ' + extra) : '') + '</span>';
      }).join('');
  }

  function pop(uid, text, cls) {
    var e = el(uid); if (!e) return;
    var d = document.createElement('span');
    d.className = 'popup ' + (cls || '');
    d.textContent = text;
    d.style.left = (30 + Math.random() * 40) + '%';
    e.querySelector('.pop').appendChild(d);
    setTimeout(function () { d.remove(); }, 900);
  }

  function log(text, cls) {
    var box = $('log');
    var d = document.createElement('div');
    d.className = 'line ' + (cls || '');
    d.innerHTML = text;
    box.appendChild(d);
    while (box.children.length > 260) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  function nameOf(uid) {
    var u = state.live[uid];
    return u ? '<b style="color:' + u.color + '">' + esc(u.title || u.name) + '</b>' : uid;
  }

  /* ------------------------------- 事件回放 ------------------------------- */
  function playEvents(events, speed) {
    state.events = events;
    state.evIndex = 0;
    state.playing = true;
    tick(speed);
  }
  function tick(speed) {
    clearTimeout(state.timer);
    var step = Math.max(1, Math.round(speed));
    var i = 0;
    while (i < step && state.evIndex < state.events.length) { step1(state.events[state.evIndex++]); i++; }
    if (state.evIndex < state.events.length) {
      state.timer = setTimeout(function () { tick(speed); }, speed < 1 ? 90 / speed : 40);
    } else {
      state.playing = false;
      var r = state.result;
      if (r) log(r.win ? '<span class="win">★ 我方胜利</span>　剩余 ' + r.catsAlive + ' 猫 / ' + r.ratsAlive + ' 鼠' :
        '<span class="lose">✖ 我方失败</span>　剩余 ' + r.catsAlive + ' 猫 / ' + r.ratsAlive + ' 鼠', 'end');
      $('result').innerHTML = r && r.win ? '<span class="win">胜利</span>' : '<span class="lose">失败</span>';
    }
  }
  function fastForward() {
    clearTimeout(state.timer);
    while (state.evIndex < state.events.length) step1(state.events[state.evIndex++]);
    state.playing = false;
    tick(1);
  }

  function step1(e) {
    var u;
    switch (e.t) {
      case 'start': log('⚓ 战斗开始：海面起雾，双方进入交战距离', 'sys'); break;
      case 'turn':
        u = state.live[e.uid];
        var all = document.querySelectorAll('.unit'); for (var i = 0; i < all.length; i++) all[i].classList.remove('acting');
        if (el(e.uid)) el(e.uid).classList.add('acting');
        /* 状态计时 */
        (u ? u.statuses : []).forEach(function (s) { if (s.turns !== 99) s.turns--; });
        (u ? u.statuses : []).forEach(function (s, i2) { if (s.turns <= 0) u.statuses.splice(i2, 1); });
        if (u) syncUnit(u);
        break;
      case 'skill':
        log(nameOf(e.uid) + ' → <span class="sk">【' + esc(e.name) + '】</span>' + (e.cost ? '<span class="cost"> -' + e.cost + 'EN</span>' : ''));
        u = state.live[e.uid]; if (u) { u.en = Math.max(0, u.en - e.cost); if (!e.cost) u.en = Math.min(u.enMax, u.en + 20); syncUnit(u); }
        break;
      case 'damage':
        u = state.live[e.tid];
        if (u) { u.hp = e.targetHp !== undefined ? e.targetHp : Math.max(0, u.hp - e.value); syncUnit(u); }
        pop(e.tid, '-' + e.value, e.crit ? 'crit' : 'dmg');
        if (e.crit) { if (el(e.tid)) { el(e.tid).classList.add('shake'); setTimeout(function () { el(e.tid).classList.remove('shake'); }, 260); } log('　└ <span class="crit">暴击！</span>' + nameOf(e.tid) + ' 受到 ' + e.value + ' 伤害'); }
        break;
      case 'miss': log('　└ 被闪避了'); break;
      case 'absorb': log('　└ 护盾吸收 ' + e.value); break;
      case 'heal':
        u = state.live[e.tid]; if (u) { u.hp = Math.min(u.maxHp, u.hp + e.value); syncUnit(u); }
        pop(e.tid, '+' + e.value, 'heal');
        log('　└ ' + nameOf(e.tid) + ' 回复 ' + e.value + '（' + esc(e.label || '治疗') + '）');
        break;
      case 'status':
        u = state.live[e.tid];
        if (u) {
          u.statuses = u.statuses.filter(function (s) { return !(s.id === e.status && s.turns !== 99); });
          u.statuses.push({ id: e.status, value: e.value, turns: e.turns, absorb: e.absorb, dot: (e.status === 'burn' || e.status === 'poison') ? e.status : null });
          syncUnit(u);
        }
        log('　└ ' + nameOf(e.tid) + ' 获得 <span class="st">' + esc(e.label) + '</span>' + (e.absorb ? '（' + Math.round(e.absorb) + '）' : '') + (e.turns && e.turns !== 99 ? ' ×' + e.turns + '回合' : ''));
        break;
      case 'dot':
        u = state.live[e.tid]; if (u) { u.hp = Math.max(0, u.hp - e.value); syncUnit(u); }
        pop(e.tid, '-' + e.value, 'dot');
        log('　└ ' + nameOf(e.tid) + ' 受到 ' + esc(e.label) + ' ' + e.value + ' 伤害');
        break;
      case 'detonate':
        u = state.live[e.tid]; if (u) { u.hp = Math.max(0, u.hp - e.value); syncUnit(u); }
        pop(e.tid, '-' + e.value, 'dot');
        log('　└ <span class="crit">引爆！</span>' + nameOf(e.tid) + ' 受到 ' + e.value + ' 伤害');
        break;
      case 'death':
        u = state.live[e.uid]; if (u) { u.dead = true; u.hp = 0; syncUnit(u); }
        log('　✝ ' + nameOf(e.uid) + ' 被击沉', 'death');
        break;
      case 'special': log('　└ ' + nameOf(e.uid) + ' 触发【' + esc(e.label) + '】'); break;
      case 'counter': log('　└ ' + nameOf(e.uid) + ' 反击！'); break;
      case 'skip': log('　└ ' + nameOf(e.uid) + ' 无法行动（' + esc(e.label) + '）'); break;
      case 'energy': log('　└ 能量 +' + e.value); break;
      case 'haste': log('　└ ' + nameOf(e.tid) + ' 获得额外行动！'); break;
      case 'selfcost': log('　└ ' + nameOf(e.uid) + ' 承受反冲 ' + e.value); break;
      case 'cleanse': log('　└ 净化了 ' + e.value + ' 个负面状态'); break;
      case 'resist': log('　└ ' + nameOf(e.tid) + ' 抵抗了 ' + esc(e.label)); break;
      case 'end':
        $('clock').textContent = '刻度 ' + e.ticks;
        break;
    }
  }

  /* -------------------------------- 出击 -------------------------------- */
  function fight(instant) {
    if (state.playing) return;
    var built = buildArena();
    var seed = (Math.random() * 1e9) | 0;
    var res = M3.simulate(built.cats, built.rats, seed, true);
    state.result = res;
    log('⚔ <b>我方 ' + state.catTeam.length + ' 舰 vs 鼠群 ' + state.ratTeam.length + ' 舰</b>　（我方 Lv' + state.catLv + ' / 敌方 Lv' + state.ratLv + '，种子 ' + seed + '）', 'sys');
    if (instant) { playEvents(res.events, 1); fastForward(); }
    else playEvents(res.events, state.speed);
  }

  /* ------------------------------ 批量模拟 ------------------------------ */
  function batch(n) {
    n = n || 200;
    var win = 0, ticks = 0, alive = 0, hp = 0, t0 = performance.now();
    for (var i = 0; i < n; i++) {
      var cats = state.catTeam.map(function (d) { return M3.makeUnit(d, state.catLv, 'cat'); });
      var rats = state.ratTeam.map(function (t) { return M3.makeUnit(t.def, t.level, 'rat'); });
      var r = M3.simulate(cats, rats, (Math.random() * 1e9) | 0, false);
      if (r.win) win++;
      ticks += r.ticks; alive += r.catsAlive; hp += r.catHpPct;
    }
    var ms = performance.now() - t0;
    log('📊 <b>批量模拟 ' + n + ' 场</b>：胜率 <span class="win">' + (win / n * 100).toFixed(1) + '%</span>' +
      '　平均 ' + (ticks / n).toFixed(0) + ' 刻度' +
      '　平均存活 ' + (alive / n).toFixed(2) + '/4　平均剩余血量 ' + (hp / n * 100).toFixed(1) + '%' +
      '　（' + ms.toFixed(0) + 'ms）', 'sys');
  }

  /* ------------------------------ 预计胜率 ------------------------------ */
  var fcTimer = null;
  function forecast() {
    clearTimeout(fcTimer);
    fcTimer = setTimeout(function () {
      var n = 40, win = 0;
      for (var i = 0; i < n; i++) {
        var cats = state.catTeam.map(function (d) { return M3.makeUnit(d, state.catLv, 'cat'); });
        var rats = state.ratTeam.map(function (t) { return M3.makeUnit(t.def, t.level, 'rat'); });
        if (M3.simulate(cats, rats, (Math.random() * 1e9) | 0, false).win) win++;
      }
      var p = win / n * 100;
      $('forecast').innerHTML = '预计胜率 <b class="' + (p >= 95 ? 'good' : p >= 60 ? 'mid' : 'bad') + '">' + p.toFixed(0) + '%</b>' +
        '<i>（按当前编队实时采样 40 场）</i>';
    }, 120);
  }

  /* -------------------------------- 交互 -------------------------------- */
  function newCatTeam() { state.catTeam = M3.pickBalancedTeam(M3.cats, 4, Math.random, { level: state.catLv }); }
  function newRatTeam() { state.ratTeam = M3.rollEnemyTeam(state.ratLv, state.ratN, Math.random); }

  function refresh() {
    renderSetup();
    $('catLvV').textContent = state.catLv;
    $('ratLvV').textContent = state.ratLv;
    $('ratNV').textContent = state.ratN;
    $('forecast').innerHTML = '预计胜率 <i>采样中…</i>';
    $('log').innerHTML = '';
    $('result').textContent = '';
    forecast();
  }

  document.addEventListener('DOMContentLoaded', function () {
    newCatTeam(); newRatTeam();
    refresh();

    $('btnRoll').onclick = function () { if (state.playing) return; newCatTeam(); refresh(); };
    $('btnReroll').onclick = function () { if (state.playing) return; newRatTeam(); renderSetup(); forecast(); };
    $('btnFight').onclick = function () { fight(false); };
    $('btnSkip').onclick = function () { if (state.playing) fastForward(); else fight(true); };
    $('btnBatch').onclick = function () { if (state.playing) return; batch(200); };
    $('btnAuto').onclick = function () { newCatTeam(); newRatTeam(); renderSetup(); fight(false); };

    $('catLv').oninput = function () { state.catLv = +this.value; renderSetup(); $('catLvV').textContent = state.catLv; forecast(); };
    $('ratLv').oninput = function () { state.ratLv = +this.value; state.ratTeam.forEach(function (t) { t.level = state.ratLv; }); renderSetup(); $('ratLvV').textContent = state.ratLv; forecast(); };
    $('ratN').oninput = function () {
      state.ratN = +this.value; $('ratNV').textContent = state.ratN;
      while (state.ratTeam.length > state.ratN) state.ratTeam.pop();
      while (state.ratTeam.length < state.ratN) state.ratTeam.push({ def: M3.mice[Math.floor(Math.random() * M3.mice.length)], level: state.ratLv });
      renderSetup(); forecast();
    };
    [['spd1', 1], ['spd2', 2], ['spd4', 4]].forEach(function (p) {
      $(p[0]).onclick = function () {
        state.speed = p[1];
        document.querySelectorAll('.spd').forEach(function (b) { b.classList.remove('on'); });
        this.classList.add('on');
      };
    });
    $('spd1').classList.add('on');

    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space') { e.preventDefault(); fight(false); }
      if (e.code === 'KeyB') batch(200);
    });
  });

  window.M3UI = { batch: batch, forecast: forecast };
})();

</script>
</body>
</html>
