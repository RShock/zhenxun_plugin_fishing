  :root{
    --bg:#0b1220; --bg2:#0f1a2e; --panel:#121f38; --panel2:#16253f;
    --line:#264064; --ink:#dbe7f5; --dim:#8aa2c0; --dim2:#5f7796;
    --cat:#5fd3c4; --rat:#e0567a; --gold:#f2c14e; --good:#6ee7a8;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:16px 16px 36px;color:var(--ink);
    background:linear-gradient(180deg,#07101d,#0b1220 40%,#0b1220);
    font-family:"HYPixel",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px;line-height:1.55;letter-spacing:.2px;
  }
  .wrap{max-width:1320px;margin:0 auto}
  header{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;
    border-bottom:2px solid var(--line);padding-bottom:9px;margin-bottom:12px}
  h1{margin:0;font-size:19px;letter-spacing:2px}
  .badge{font-size:11px;background:var(--cat);color:#08131f;padding:2px 7px;font-weight:700}
  .sub{color:var(--dim);font-size:11.5px}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tab{font:inherit;font-size:12.5px;cursor:pointer;padding:6px 14px;letter-spacing:1px;
    background:#16233a;color:var(--ink);border:2px solid var(--line)}
  .tab.on{background:var(--cat);color:#07131d;border-color:#7fe3d6;font-weight:700}
  .tab.rat.on{background:var(--rat);border-color:#f08ba5;color:#22060e}
  .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:2px solid var(--line)}
  .panel>h2{margin:0;font-size:12px;letter-spacing:1.5px;padding:7px 10px;
    background:var(--panel2);border-bottom:2px solid var(--line)}
  .body{padding:9px}
  /* 列表 */
  #roster{display:flex;flex-direction:column;gap:6px;max-height:76vh;overflow:auto}
  .item{display:flex;align-items:center;gap:8px;text-align:left;width:100%;cursor:pointer;font:inherit;
    background:#101d33;border:2px solid #1d3050;border-left:4px solid var(--c);color:var(--ink);padding:5px 7px}
  .item:hover{background:#16263f}
  .item.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .glyph{width:22px;height:22px;display:grid;place-items:center;background:var(--c);
    color:#08131f;font-weight:700;font-size:12px;flex:0 0 auto}
  .item .meta{flex:1;display:flex;flex-direction:column;line-height:1.2}
  .item .meta b{font-size:12px}
  .item .meta i{font-style:normal;color:var(--dim);font-size:10.5px}
  .item .mini{font-size:10px;color:var(--dim2);white-space:nowrap}
  /* 详情 */
  .dhead{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:2px solid var(--line);
    background:linear-gradient(90deg,var(--c) 0 4px,#0f1a2e 4px)}
  .dbig{width:38px;height:38px;display:grid;place-items:center;background:var(--c);color:#08131f;font-size:20px;font-weight:700}
  .dname{display:flex;flex-direction:column;line-height:1.25}
  .dname b{font-size:17px}

<script>
/* ==========================================================================
 * map3 · 猫鼠远洋 —— 角色数据（整数化 · 技能随等级成长）
 * --------------------------------------------------------------------------
 * 【数值规则】
 *  1. 角色所有数据（HP/ATK/DEF/SPD/暴击/技能数值）**一律整数**：
 *     - 属性：stat(L) = round(基础值 × (1 + 成长率 × (L-1)))，逐级四舍五入成整数
 *     - 暴击：整数百分比，每 4 级 +1%（L1 基础 → L5 +1 → L9 +2 → L13 +3 → L17 +4）
 *     - 技能：整数百分点，数值(L) = 基础 + 每级增量 × (L-1)，可设上限；不产生小数
 *  2. 技能随等级成长：4 个技能槽（被动1/大招1/被动2/大招2）在 L1/L5/L10/L15 逐个解锁，
 *     解锁后每级都会继续增强（被动与主动同等对待）。
 *  3. 技能数值一律写成整数百分点（60 = 60%），引擎内部再折算为系数；
 *     界面上永远只出现整数，不会出现 0.6 这类小数。
 * ========================================================================== */
(function (root) {
  var M3 = (root.M3 = root.M3 || {});

  /* ------------------------------ 成长基准 ------------------------------ */
  M3.growth = {
    hp: 0.105,   // L20 ≈ L1 × 2.99
    atk: 0.090,  // L20 ≈ L1 × 2.71
    def: 0.085,  // L20 ≈ L1 × 2.61
    spd: 0.050,  // L20 ≈ L1 × 1.95
    critStep: 4  // 每 4 级暴击 +1%
  };

  /* 数值规格：number 直接使用；{b,i,cap} = 基础 + 每级增量×（L-1），不超过上限 */
  M3.resolve = function (spec, lv) {
    if (spec === undefined || spec === null) return 0;
    if (typeof spec === 'number') return spec;
    if (typeof spec === 'string') return spec; /* 由调用方按键查找 */
    var v = spec.b + (spec.i || 0) * (lv - 1);
    if (spec.cap !== undefined) v = Math.min(spec.cap, v);
    return v;
  };
  M3.frac = function (spec, lv) { return M3.resolve(spec, lv) / 100; };

  /* 属性表：逐级四舍五入，保证每个等级都是整数 */
  M3.statAt = function (base, lv) {
    var g = M3.growth, k = lv - 1;
    return {
      hp: Math.round(base.hp * (1 + g.hp * k)),
      atk: Math.round(base.atk * (1 + g.atk * k)),
      def: Math.round(base.def * (1 + g.def * k)),
      spd: Math.round(base.spd * (1 + g.spd * k)),
      crit: base.crit + Math.floor(k / g.critStep)      /* 整数百分点 */
    };
  };
  /* 完整 1~20 级属性表（展示 / 自检用） */
  M3.statTable = function (def) {
    var rows = [];
    for (var lv = 1; lv <= 20; lv++) rows.push(Object.assign({ lv: lv }, M3.statAt(def.base, lv)));

          tmpl: '对全体造成 <b>{mul}%</b> 伤害，{chance}% 几率麻痹 {turns} 回合。',

  /* --------------------------- 敌方编队 / 地图表 --------------------------- */
  M3.mapTable = [
    { id: 1, name: '猫港（我方领土）', level: 1, enemies: 0, fortress: null },
    { id: 2, name: '锈齿浅滩', level: 3, enemies: 3, fortress: '锈齿哨站' },
    { id: 3, name: '煤烟海峡', level: 5, enemies: 3, fortress: '煤烟熔炉' },
    { id: 4, name: '油污湾', level: 7, enemies: 4, fortress: '油污提炼厂' },
    { id: 5, name: '废铁环礁', level: 9, enemies: 4, fortress: '废铁船坞' },
    { id: 6, name: '毒雾沼泽海', level: 11, enemies: 4, fortress: '毒雾化工塔' },
    { id: 7, name: '齿轮暗流', level: 13, enemies: 4, fortress: '齿轮总装线' },
    { id: 8, name: '蒸汽风暴角', level: 15, enemies: 5, fortress: '蒸汽核心' },
    { id: 9, name: '灰烬深海', level: 17, enemies: 5, fortress: '灰烬中枢' },
    { id: 10, name: '鼠王钢堡', level: 20, enemies: 5, fortress: '联合体总部' }
  ];

  /* ------------------------------ 展示辅助 ------------------------------ */
  /* 解析技能描述里的 {token}（token 指向 vals 的键，或 vals 内的字面值） */
  M3.descOf = function (skill, lv) {
    if (!skill) return '';
    var vals = skill.vals || {};
    return String(skill.tmpl || '').replace(/\{(\w+)\}/g, function (_, key) {
      if (!(key in vals)) return '{' + key + '}';
      var v = vals[key];
      return typeof v === 'object' ? M3.resolve(v, lv) : v;
    });
  };
  /* 技能数值列表（用于展示"每级成长"） */
  M3.skillRows = function (skill) {
    var vals = skill.vals || {};
    return Object.keys(vals).map(function (key) {
      var v = vals[key];
      if (typeof v !== 'object' || v.b === undefined) {
        return { key: key, from: v, to: v, perLevel: 0, cap: null, flat: true };
      }
      return {
        key: key, from: M3.resolve(v, 1), to: M3.resolve(v, 20),
        perLevel: v.i || 0, cap: v.cap === undefined ? null : v.cap, flat: (v.i || 0) === 0
      };
    });
  };
  /* 全部技能槽（含解锁等级），按解锁顺序 */
  M3.slotsOf = function (def) {
    var out = [];
    (def.passives || []).forEach(function (p, i) {
      out.push({ key: 'p' + (i + 1), kind: 'passive', skill: p, unlock: p.unlock || 1 });
    });
    (def.ults || []).forEach(function (u, i) {
      out.push({ key: 'u' + (i + 1), kind: 'ult', skill: u, unlock: u.unlock || 1 });
    });
    return out.sort(function (a, b) { return a.unlock - b.unlock; });
  };

  M3.cats = CATS;
  M3.mice = MICE;
  M3.byId = function (id) {
    var all = CATS.concat(MICE);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = M3;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ==========================================================================
 * map3 · 角色图鉴（展示页逻辑）
 * --------------------------------------------------------------------------
 * 展示 10 名我方猫猫 + 10 名老鼠杂兵：
 *   · 属性成长表（1~20 级，全部整数，逐级四舍五入）
 *   · 4 个技能槽的详细效果（被动1/大招1/被动2/大招2），按当前等级解析实时数值
 *   · 技能成长：解锁等级、每级增量、上限、L1→L20 数值区间
 * ========================================================================== */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  };
  /* 只允许 <b> 高亮标签通过 */
  function rich(html) {
    return String(html).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>');
  }

  var state = { side: 'cat', id: 'cat_tuffy', lv: 10 };
  var pool = function () { return state.side === 'cat' ? M3.cats : M3.mice; };
  var current = function () { return M3.byId(state.id) || pool()[0]; };

  /* ------------------------------ 列表 ------------------------------ */
  function roster() {
    var items = pool();
    var html = items.map(function (d) {
      var on = d.id === state.id ? ' on' : '';
      var s = M3.statAt(d.base, state.lv);
      return '<button class="item' + on + '" data-id="' + d.id + '" style="--c:' + d.color + '">' +
        '<span class="glyph">' + esc((d.title || d.name).slice(0, 1)) + '</span>' +
        '<span class="meta"><b>' + esc(d.title || d.name) + '</b><i>' + esc(d.role) + '</i></span>' +
        '<span class="mini">HP ' + s.hp + ' · ATK ' + s.atk + '</span>' +
        '</button>';
    }).join('');
    $('roster').innerHTML = html;
    Array.prototype.forEach.call($('roster').querySelectorAll('.item'), function (btn) {
      btn.onclick = function () { state.id = btn.dataset.id; render(); };
    });
  }

  /* ------------------------------ 属性区 ------------------------------ */
  function statBlock(d) {
    var s = M3.statAt(d.base, state.lv);
    var s1 = M3.statAt(d.base, 1), s20 = M3.statAt(d.base, 20);
    var cells = [
      ['HP', s.hp, s1.hp, s20.hp],
      ['ATK', s.atk, s1.atk, s20.atk],
      ['DEF', s.def, s1.def, s20.def],
      ['SPD', s.spd, s1.spd, s20.spd],
      ['暴击', s.crit + '%', s1.crit + '%', s20.crit + '%']
    ].map(function (c) {
      return '<div class="stat">' +
        '<span class="k">' + c[0] + '</span>' +
        '<span class="v">' + c[1] + '</span>' +
        '<span class="r">Lv1 ' + c[2] + ' → Lv20 ' + c[3] + '</span>' +
        '</div>';
    }).join('');
    return '<div class="stats">' + cells + '</div>';
  }

  /* 1~20 级属性表（整数，逐级四舍五入） */
  function growthTable(d) {
    var rows = M3.statTable(d);
    var head = '<tr><th>等级</th><th>HP</th><th>ATK</th><th>DEF</th><th>SPD</th><th>暴击</th></tr>';
    var body = rows.map(function (r) {
      var on = r.lv === state.lv ? ' class="on"' : '';
      return '<tr' + on + '><td>' + r.lv + '</td><td>' + r.hp + '</td><td>' + r.atk + '</td><td>' +
        r.def + '</td><td>' + r.spd + '</td><td>' + r.crit + '%</td></tr>';
    }).join('');
    return '<div class="tablewrap"><table class="grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  /* ------------------------------ 技能区 ------------------------------ */
  function skillCard(slot, d) {
    var sk = slot.skill;
    var locked = state.lv < slot.unlock;
    var kindLabel = slot.kind === 'ult' ? '必杀' : '被动';
    var cost = sk.cost ? (sk.cost + ' EN') : '常驻';
    var rows = M3.skillRows(sk);
    var growth = rows.map(function (r) {
      if (!r.perLevel) return '<span class="g"><i>' + esc(r.key) + '</i>固定值 ' + r.from + '</span>';
      var capTxt = r.cap !== null ? '，上限 ' + r.cap : '';
      var now = M3.resolve(sk.vals[r.key], state.lv);
      return '<span class="g"><i>' + esc(r.key) + '</i>本级 Lv' + state.lv + ' <b>' + now +
        '</b> → Lv20 ' + r.to + '　<span class="per">每级 +' + r.perLevel + capTxt + '</span></span>';
    }).join('');
    return '<div class="skill' + (locked ? ' locked' : '') + ' ' + slot.kind + '">' +
      '<div class="shead">' +
      '<span class="tag">' + kindLabel + '</span>' +
      '<b>' + esc(sk.name) + '</b>' +
      '<span class="lvtag">' + (locked ? 'Lv' + slot.unlock + ' 解锁' : '已解锁') + '</span>' +
      '<span class="cost">' + cost + '</span>' +
      '</div>' +
      '<p class="desc">' + rich(M3.descOf(sk, state.lv)) + '</p>' +
      '<div class="growth">' + growth + '</div>' +
      (locked ? '<div class="lockmask">当前等级未解锁（' + state.lv + ' / ' + slot.unlock + '）</div>' : '') +
      '</div>';
  }

  /* ------------------------------ 渲染 ------------------------------ */
  function render() {
    var d = current();
    roster();

    $('dName').textContent = d.title || d.name;
    $('dRole').textContent = d.role + ' · ' + (state.side === 'cat' ? '我方猫猫' : '敌方老鼠');
    $('dGlyph').textContent = (d.title || d.name).slice(0, 1);
    $('dCard').style.setProperty('--c', d.color);
    $('dLv').textContent = state.lv;
    $('dStats').innerHTML = statBlock(d);
    $('dGrowth').innerHTML = growthTable(d);
    $('dSkills').innerHTML = M3.slotsOf(d).map(function (s) { return skillCard(s, d); }).join('');
    $('dNote').textContent = state.side === 'cat'
      ? '我方编队最多 4 人；同级战斗为敌方杂兵强度基准。'
      : '敌方老鼠遵循同一系统（2 被动 + 2 大招），数值上限更保守。';
  }

  document.addEventListener('DOMContentLoaded', function () {
    /* 侧边切换 */
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.onclick = function () {
        state.side = t.dataset.side;
        state.id = pool()[0].id;
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('on'); });
        t.classList.add('on');
        render();
      };
    });
    /* 等级控制 */
    $('lv').oninput = function () { state.lv = +this.value; $('dLv').textContent = state.lv; render(); };
    Array.prototype.forEach.call(document.querySelectorAll('.jump'), function (b) {
      b.onclick = function () {
        state.lv = +b.dataset.lv;
        $('lv').value = state.lv;
        render();
      };
    });
    render();
  });

  window.M3Gallery = { render: render, state: state };
})();

</script>
