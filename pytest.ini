[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 独立仓库导入路径（ci/runtime 提供 zhenxun.plugins.zhenxun_plugin_fishing）
pythonpath = . ci ci/runtime
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
# --confcutdir=.: 防止向上加载完整 bot 仓库的 conftest / 真实 NoneBot
# -p support.pytest_plugin: 在包 __init__ 导入前安装 nonebot 桩
addopts = -q --confcutdir=. -p support.pytest_plugin
