{% extends "base.html" %}
{% block extra_css %}
{% include "s2_art.css" %}
<style>
.status-title { text-align:center; color:#6b3a1a; font-size:24px; font-weight:800; margin:2px 0 10px; }
.tech-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:7px; }
.tech-cell { min-width:0; position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
.tech-cell img.tech-icon { width:78%; height:78%; object-fit:contain; image-rendering:pixelated; }
.tech-cell .level-badge { position:absolute; right:3px; bottom:3px; width:auto; height:8px; image-rendering:pixelated; filter:drop-shadow(0 0 1px #fffaf0); }
.empty-tech { grid-column:1/-1; text-align:center; color:#9a7b5a; padding:20px 8px; }
@media (max-width:420px) { .tech-grid { grid-template-columns:repeat(5, 1fr); gap:5px; } }
</style>
{% endblock %}
{% block content %}
<div class="status-title">星穹矿脉 · 挖矿状态</div>
<div class="tech-grid">
  {% for r in rows %}
  <div class="tech-cell">
    <img class="tech-icon" src="{{ r.icon }}" alt="" style="filter:hue-rotate({{ r.hue }}deg);">
    <img class="level-badge" src="{{ r.pixel_level }}" alt="Lv{{ r.level }}">
  </div>
  {% else %}
  <div class="empty-tech">尚未建成科技。发送【挖矿商店】查看可建设项目。</div>
  {% endfor %}
</div>
{% endblock %}
