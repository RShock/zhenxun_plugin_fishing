<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕的湖畔骑行 · SVG 动画</title>
  <style>
    :root {
      --ink: #183d4a;
      --muted: #62818a;
      --paper: #fffdf7;
      --line: #d7e7e1;
      --teal: #167c82;
      --orange: #f28b47;
      --yellow: #f5c85b;
      --shadow: 0 24px 60px rgba(35, 74, 77, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(245, 200, 91, .18), transparent 28rem),
        linear-gradient(135deg, #e7f3ed 0%, #f6f1e5 58%, #fbe9cf 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      padding: 0 4px 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 2px;
      content: "";
      background: var(--orange);
      border-radius: 999px;
    }

    h1 {
      margin: 0;
      color: #173d4b;
      font-size: clamp(30px, 5vw, 58px);
      font-weight: 800;
      letter-spacing: -.065em;
      line-height: .98;
    }

    .intro p {
      max-width: 340px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 10px 14px;
      border: 1px solid rgba(22, 124, 130, .18);
      border-radius: 999px;
      color: var(--teal);
      background: rgba(255,255,255,.58);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #40ba8a;
      box-shadow: 0 0 0 4px rgba(64, 186, 138, .14);
    }

    .artboard {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .artboard::before {
      position: absolute;
      z-index: 1;
      top: 0;
      right: 0;
      left: 0;
      height: 8px;
      content: "";
      background: linear-gradient(90deg, var(--orange), var(--yellow), #58bda8, var(--teal));
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
      user-select: none;
    }

    .controls {
      position: absolute;
      z-index: 5;
      right: 24px;
      bottom: 22px;
      display: flex;
      gap: 8px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(24,61,74,.14);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,253,247,.84);
      box-shadow: 0 8px 18px rgba(24,61,74,.08);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(10px);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    button:hover { transform: translateY(-2px); background: #fff; box-shadow: 0 12px 24px rgba(24,61,74,.13); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid rgba(242, 139, 71, .45); outline-offset: 3px; }
    button svg { width: 15px; height: 15px; }

    .caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 22px 16px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      color: var(--muted);
      font-size: 12px;
    }

    .caption strong { color: var(--ink); font-weight: 750; }

    /* The motion is intentionally CSS/SVG-only: no images, canvas, or dependencies. */
    .cloud { animation: cloud-drift 18s linear infinite; transform-box: fill-box; transform-origin: center; }
    .cloud.slow { animation-duration: 28s; animation-delay: -11s; }
    .water-line { animation: water-shimmer 2.8s ease-in-out infinite; }
    .rider-bob { animation: rider-bob 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 50% 64%; }
    .wing-flap { animation: wing-flap 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 51% 43%; }
    .leg-front { animation: leg-front 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 48% 55%; }
    .leg-back { animation: leg-back 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 48% 55%; }
    .helmet-feather { animation: feather-sway 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 58% 25%; }
    .flag-wave { animation: flag-wave 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }

    .is-paused .cloud,
    .is-paused .water-line,
    .is-paused .rider-bob,
    .is-paused .wing-flap,
    .is-paused .leg-front,
    .is-paused .leg-back,
    .is-paused .helmet-feather,
    .is-paused .flag-wave { animation-play-state: paused; }

    @keyframes cloud-drift {
      from { transform: translateX(-30px); }
      to { transform: translateX(74px); }
    }
    @keyframes water-shimmer {
      0%, 100% { opacity: .24; transform: translateX(0); }
      50% { opacity: .7; transform: translateX(12px); }
    }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @keyframes pedal-turn { to { transform: rotate(360deg); } }
    @keyframes rider-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes wing-flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-7deg); }
    }
    @keyframes leg-front {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(7deg); }
    }
    @keyframes leg-back {
      0%, 100% { transform: rotate(6deg); }
      50% { transform: rotate(-7deg); }
    }
    @keyframes feather-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes flag-wave {
      0%, 100% { transform: skewY(0deg); }
      50% { transform: skewY(-5deg); }
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 22px, 620px); padding-top: 20px; }
      .intro { display: block; padding-bottom: 14px; }
      .status-pill { margin-top: 18px; }
      .artboard { border-radius: 20px; }
      .controls { right: 14px; bottom: 50px; }
      .caption { display: block; padding: 12px 15px; line-height: 1.6; }
      .caption span { display: block; }
      .caption span + span { margin-top: 2px; }
      button { min-height: 36px; padding: 0 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <div>
        <div class="eyebrow">SVG motion study · 01</div>
        <h1>湖畔骑行，<br />鹈鹕出发。</h1>
        <p>一只戴着小头盔的鹈鹕，沿着湖边慢悠悠地踩着自行车。所有画面都由 SVG 图形和 CSS 动画绘制而成。</p>
      </div>
      <div class="status-pill"><span class="status-dot"></span>正在巡航 · 2D 动画</div>
    </header>

    <section class="artboard" aria-label="鹈鹕骑自行车的 SVG 动画场景">
      <svg id="pelicanRide" viewBox="0 0 1000 600" role="img" aria-labelledby="sceneTitle sceneDesc">
        <title id="sceneTitle">鹈鹕在湖边骑自行车</title>
        <desc id="sceneDesc">一只橙色长嘴、戴着黄色头盔的白色鹈鹕，正在蓝绿色自行车上踩踏板。车轮、云朵、翅膀和水面都在循环运动。</desc>

        <defs>
          <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ccecea" />
            <stop offset="58%" stop-color="#e9f3e4" />
            <stop offset="100%" stop-color="#fff3d4" />
          </linearGradient>
          <linearGradient id="lakeGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7cc4bf" />
            <stop offset="100%" stop-color="#4aa3a9" />
          </linearGradient>
          <linearGradient id="roadGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f1d6a9" />
            <stop offset="100%" stop-color="#e8bd8d" />
          </linearGradient>
          <linearGradient id="featherGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fffdf3" />
            <stop offset="100%" stop-color="#e9e6d8" />
          </linearGradient>
          <linearGradient id="beakGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffb15b" />
            <stop offset="100%" stop-color="#ed7045" />
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-50%" width="160%" height="220%">
            <feGaussianBlur stdDeviation="9" />
          </filter>
          <filter id="tinyShadow" x="-30%" y="-50%" width="160%" height="220%">
            <feGaussianBlur stdDeviation="3" />
          </filter>
          <pattern id="roadSpeckles" width="34" height="18" patternUnits="userSpaceOnUse">
            <circle cx="4" cy="7" r="1.2" fill="#c7926f" opacity=".22" />
            <circle cx="23" cy="13" r=".9" fill="#c7926f" opacity=".18" />
          </pattern>
        </defs>

        <!-- sky and distant landscape -->
        <rect width="1000" height="600" fill="url(#skyGradient)" />
        <circle cx="810" cy="118" r="60" fill="#ffe6a0" opacity=".62" />
        <circle cx="810" cy="118" r="88" fill="#fff2c5" opacity=".23" />

        <g class="cloud" opacity=".72" fill="#fffdf5">
          <path d="M72 145c0-19 17-34 37-34 8 0 16 3 22 8 8-18 25-30 46-30 28 0 50 21 51 48h8c17 0 30 13 30 29H72c-11 0-20-9-20-20 0-1 0-1 0-2 1-1 6-1 20-1Z" />
        </g>
        <g class="cloud slow" opacity=".48" fill="#fffdf7">
          <path d="M650 85c0-14 12-26 27-26 7 0 13 2 18 6 7-14 20-23 35-23 22 0 38 16 39 37h10c13 0 24 11 24 24H650c-6-4-10-10-10-18Z" />
        </g>

        <path d="M0 303 C125 258 227 280 331 309 S550 346 680 294 S887 256 1000 293 V399 H0Z" fill="#a9d2bd" opacity=".72" />
        <path d="M0 329 C150 290 250 315 370 337 S614 354 728 313 S904 292 1000 321 V420 H0Z" fill="#7eb6a9" opacity=".7" />

        <!-- lake -->
        <path d="M0 352 C155 338 273 356 406 348 S700 335 1000 355 V456 H0Z" fill="url(#lakeGradient)" />
        <g class="water-line" fill="none" stroke="#d4f1df" stroke-linecap="round" opacity=".45">
          <path d="M39 379h125m44 0h67m46 0h148m47 0h109m52 0h126" stroke-width="3" />
          <path d="M93 400h72m52 0h148m39 0h88m53 0h158" stroke-width="2" />
          <path d="M25 425h154m62 0h103m46 0h151m39 0h175" stroke-width="3" />
        </g>
        <path d="M0 423 C175 415 301 435 466 422 S755 411 1000 426 V600 H0Z" fill="url(#roadGradient)" />
        <path d="M0 423 C175 415 301 435 466 422 S755 411 1000 426 V600 H0Z" fill="url(#roadSpeckles)" opacity=".8" />
        <path d="M0 426 C177 418 302 439 466 426 S755 414 1000 430" fill="none" stroke="#fff0cf" stroke-width="5" opacity=".72" />
        <path d="M0 572h1000" stroke="#c58b6e" stroke-width="2" opacity=".2" />

        <!-- little roadside details -->
        <g fill="none" stroke-linecap="round">
          <path d="M102 459c-1-30 5-44 15-60M116 456c7-25 17-35 29-43M108 444c-8-17-15-22-25-27" stroke="#4d967b" stroke-width="4" />
          <path d="M85 420c-8-9-5-22 7-25 5 8 3 19-7 25ZM140 414c-5-10 1-21 13-22 4 9-1 18-13 22ZM95 407c-6-10-1-20 11-22 3 9-2 18-11 22Z" fill="#f09b72" stroke="#f09b72" stroke-width="2" />
          <path d="M874 481c-1-24 4-36 12-53M886 479c8-21 16-30 27-38" stroke="#4d967b" stroke-width="4" />
          <path d="M879 445c-7-8-4-17 6-21 4 8 2 15-6 21ZM911 435c-4-9 1-17 11-18 3 8-2 15-11 18Z" fill="#f6c25e" stroke="#f6c25e" stroke-width="2" />
        </g>

        <!-- roadside pennant -->
        <g transform="translate(192 329)">
          <path d="M0 0v113" stroke="#3b7371" stroke-width="4" stroke-linecap="round" />
          <g class="flag-wave">
            <path d="M2 4h76l-16 22 16 22H2Z" fill="#f28b47" />
            <path d="M14 4h28v44H14Z" fill="#f5c85b" opacity=".85" />
          </g>
        </g>

        <!-- cast shadow under the moving bike -->
        <ellipse cx="504" cy="548" rx="268" ry="21" fill="#7d765f" opacity=".2" filter="url(#softShadow)" />

        <!-- bicycle: wheels are separate rotating SVG groups -->
        <g aria-label="自行车">
          <g class="wheel" transform="translate(325 467)">
            <g class="wheel-spin">
              <circle r="78" fill="#f8f7e9" stroke="#183d4a" stroke-width="8" />
              <circle r="66" fill="none" stroke="#8ea8a5" stroke-width="2" />
              <g stroke="#8ea8a5" stroke-width="2" opacity=".84">
                <path d="M0-67V67M-67 0H67M-47-47L47 47M47-47L-47 47" />
                <path d="M-24-63L24 63M24-63L-24 63M-63-24L63 24M-63 24L63-24" />
              </g>
              <circle r="8" fill="#f28b47" stroke="#183d4a" stroke-width="4" />
              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite" />
            </g>
          </g>
          <g class="wheel" transform="translate(683 467)">
            <g class="wheel-spin">
              <circle r="78" fill="#f8f7e9" stroke="#183d4a" stroke-width="8" />
              <circle r="66" fill="none" stroke="#8ea8a5" stroke-width="2" />
              <g stroke="#8ea8a5" stroke-width="2" opacity=".84">
                <path d="M0-67V67M-67 0H67M-47-47L47 47M47-47L-47 47" />
                <path d="M-24-63L24 63M24-63L-24 63M-63-24L63 24M-63 24L63-24" />
              </g>
              <circle r="8" fill="#f28b47" stroke="#183d4a" stroke-width="4" />
              <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite" />
            </g>
          </g>

          <!-- frame and handlebars -->
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M325 467 421 354 492 467 325 467ZM421 354 580 354 492 467M580 354l103 113M580 354l18-49" stroke="#167c82" stroke-width="10" />
            <path d="M580 354c10-22 13-36 1-46 18 0 31 8 31 20 0 13-9 20-30 26" stroke="#183d4a" stroke-width="8" />
            <path d="M391 349h59" stroke="#183d4a" stroke-width="10" />
            <path d="M397 339h48" stroke="#f28b47" stroke-width="7" />
            <path d="M325 467h20M674 467h20" stroke="#183d4a" stroke-width="7" />
          </g>
          <circle cx="492" cy="467" r="20" fill="#f6c85f" stroke="#183d4a" stroke-width="5" />
          <g class="pedal-spin">
            <path d="M492 467l30-31M492 467l-34 27" stroke="#183d4a" stroke-width="5" stroke-linecap="round" />
            <path d="M517 433h23M428 498h24" stroke="#183d4a" stroke-width="6" stroke-linecap="round" />
            <animateTransform attributeName="transform" type="rotate" from="0 492 467" to="360 492 467" dur="1.1s" repeatCount="indefinite" />
          </g>
        </g>

        <!-- animated pelican rider -->
        <g class="rider-bob" aria-label="鹈鹕骑手">
          <!-- legs behind the body -->
          <g class="leg-back" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M469 309c-5 35-25 72-14 102 5 14 20 28 37 37" stroke="#d99754" stroke-width="16" />
            <path d="M490 447c11 5 17 12 18 20" stroke="#ed7948" stroke-width="9" />
          </g>
          <g class="leg-front" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M504 307c19 37 43 64 59 89 6 10 0 28-11 40" stroke="#e4a15c" stroke-width="16" />
            <path d="M552 434c-9 11-11 22-7 30" stroke="#ed7948" stroke-width="9" />
          </g>

          <!-- tail feathers -->
          <path d="M414 304c-28 8-51 14-78 3 18 24 44 34 79 24Z" fill="#d9ded5" stroke="#183d4a" stroke-width="5" stroke-linejoin="round" />
          <path d="M412 313c-32 20-55 29-80 24 24 18 50 21 83 6Z" fill="#f7f5e8" stroke="#183d4a" stroke-width="5" stroke-linejoin="round" />

          <!-- body -->
          <path d="M410 291c-6-47 27-94 90-104 61-10 112 18 126 70 10 37-9 67-49 76-62 14-157 12-167-42Z" fill="url(#featherGradient)" stroke="#183d4a" stroke-width="6" />
          <path d="M439 248c22-30 68-47 109-34 25 8 41 21 51 40-19-9-37-9-53 2-29 20-65 33-107 21Z" fill="#fffdf7" opacity=".82" />

          <!-- near wing -->
          <g class="wing-flap">
            <path d="M481 234c37 4 76 23 93 47 12 17 7 38-11 49-30 19-88 5-116-24 25-8 36-26 34-72Z" fill="#e1e4d9" stroke="#183d4a" stroke-width="6" />
            <path d="M472 287c32 5 59 13 82 29M477 271c27 6 50 14 71 28M482 255c22 5 39 12 57 23" fill="none" stroke="#b2c0b5" stroke-width="4" stroke-linecap="round" />
          </g>

          <!-- neck and head -->
          <path d="M553 223c15-30 10-67 21-91 11-25 35-39 62-32 34 9 50 39 43 72-9 43-50 63-101 63Z" fill="url(#featherGradient)" stroke="#183d4a" stroke-width="6" />
          <path d="M588 108c18-18 54-16 73 1-9 9-18 13-28 12-16-2-30-2-45 0Z" fill="#f4c55f" stroke="#183d4a" stroke-width="5" />
          <path d="M596 103c8-18 17-29 27-37 2 19-2 34-11 44M617 99c9-17 20-25 31-30-1 17-7 30-18 38" fill="#efa95a" stroke="#183d4a" stroke-width="5" stroke-linejoin="round" />

          <!-- helmet -->
          <path d="M586 104c8-32 35-52 66-45 20 4 35 17 41 35l-4 18c-31-15-65-13-103-8Z" fill="#f5c85b" stroke="#183d4a" stroke-width="6" />
          <path d="M589 106c34-9 69-7 103 7" fill="none" stroke="#ed814a" stroke-width="7" stroke-linecap="round" />
          <path d="M674 107c12 12 15 27 14 39" fill="none" stroke="#183d4a" stroke-width="5" stroke-linecap="round" />
          <g class="helmet-feather">
            <path d="M625 56c3-22 13-34 29-43 4 19 0 34-13 47Z" fill="#f28b47" stroke="#183d4a" stroke-width="5" stroke-linejoin="round" />
          </g>

          <!-- face and signature pelican bill -->
          <ellipse cx="656" cy="138" rx="7" ry="8" fill="#183d4a" />
          <circle cx="658" cy="135" r="2.3" fill="#fffdf7" />
          <path d="M677 145c25-9 60-5 113 10 22 6 34 15 35 25-34 10-79 12-120 1-22-6-35-18-28-36Z" fill="url(#beakGradient)" stroke="#183d4a" stroke-width="6" stroke-linejoin="round" />
          <path d="M679 168c37 5 91 2 145-9-3 25-24 50-58 56-38 7-72-13-87-47Z" fill="#f28b47" stroke="#183d4a" stroke-width="6" stroke-linejoin="round" />
          <path d="M693 178c29 9 65 13 101 7" fill="none" stroke="#d95f48" stroke-width="4" stroke-linecap="round" opacity=".8" />
          <path d="M813 166c7 4 11 9 12 15" fill="none" stroke="#b95147" stroke-width="4" stroke-linecap="round" />

          <!-- neck scarf and tiny handle grip -->
          <path d="M575 213c20 13 42 16 64 11l-8 23c-21 7-43 2-62-11Z" fill="#167c82" stroke="#183d4a" stroke-width="5" />
          <path d="M627 237c17 2 32-3 45-13" fill="none" stroke="#f5c85b" stroke-width="5" stroke-linecap="round" />
          <path d="M627 237c-10 18-22 23-36 25" fill="none" stroke="#183d4a" stroke-width="5" stroke-linecap="round" />
        </g>

        <!-- foreground speed marks -->
        <g fill="none" stroke="#fff4d8" stroke-linecap="round" opacity=".8">
          <path d="M737 510h59" stroke-width="5" />
          <path d="M792 530h38" stroke-width="3" />
          <path d="M194 526h48" stroke-width="4" />
        </g>
        <g transform="translate(44 530)">
          <circle r="4" fill="#f28b47" /><circle cx="18" cy="-7" r="3" fill="#167c82" /><circle cx="36" cy="3" r="4" fill="#f5c85b" />
        </g>
      </svg>

      <div class="controls" aria-label="动画控制">
        <button id="toggleMotion" type="button" aria-pressed="false" title="暂停或继续动画">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path id="toggleIcon" d="M7 5h3v14H7Zm7 0h3v14h-3Z" fill="currentColor" /></svg>
          <span id="toggleLabel">暂停动画</span>
        </button>
        <button id="replayMotion" type="button" title="从头播放">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 1 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /><path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span>重播</span>
        </button>
      </div>

      <div class="caption">
        <span><strong>湖畔路线 / 07:40 AM</strong> · 风从鹈鹕的左侧吹来</span>
        <span>CSS keyframes + SVG animateTransform</span>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const scene = document.querySelector('#pelicanRide');
      const toggle = document.querySelector('#toggleMotion');
      const toggleLabel = document.querySelector('#toggleLabel');
      const toggleIcon = document.querySelector('#toggleIcon');
      const replay = document.querySelector('#replayMotion');

      const setPaused = (paused) => {
        scene.classList.toggle('is-paused', paused);
        toggle.setAttribute('aria-pressed', String(paused));
        toggleLabel.textContent = paused ? '继续动画' : '暂停动画';
        toggleIcon.setAttribute('d', paused ? 'M8 5v14l11-7Z' : 'M7 5h3v14H7Zm7 0h3v14h-3Z');
        if (paused) scene.pauseAnimations();
        else scene.unpauseAnimations();
      };

      toggle.addEventListener('click', () => {
        setPaused(!scene.classList.contains('is-paused'));
      });

      replay.addEventListener('click', () => {
        scene.classList.remove('is-paused');
        scene.setCurrentTime(0);
        scene.unpauseAnimations();
        toggle.setAttribute('aria-pressed', 'false');
        toggleLabel.textContent = '暂停动画';
        toggleIcon.setAttribute('d', 'M7 5h3v14H7Zm7 0h3v14h-3Z');
      });
    })();
  </script>
</body>
</html>
