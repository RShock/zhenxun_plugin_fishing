name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Prepare import paths
        run: |
          python ci/setup_path.py
          # Ensure package layout exists for zhenxun.plugins.zhenxun_plugin_fishing
          mkdir -p ci/runtime/zhenxun/plugins
          ln -sfn "$GITHUB_WORKSPACE" ci/runtime/zhenxun/plugins/zhenxun_plugin_fishing
          test -f ci/runtime/zhenxun/__init__.py
          test -f ci/runtime/zhenxun/plugins/__init__.py
          test -e ci/runtime/zhenxun/plugins/zhenxun_plugin_fishing/__init__.py

      - name: Run all plugin tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/runtime:${{ github.workspace }}/ci:${{ github.workspace }}
          ZX_LIGHTWEIGHT_NONEBOT: "1"
          ZX_LIGHTWEIGHT_NONEBOT_STUBS: "1"
        run: |
          set +e
          python -m pytest tests --tb=long -v --confcutdir=. -p support.pytest_plugin 2>&1 | tee /tmp/test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -ne 0 ]; then
            echo "## Test Output (last 60 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -60 /tmp/test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Also emit error annotations for FAILED/ERROR lines
            grep -E "^(FAILED|ERROR|E |_____ )" /tmp/test_output.txt | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi
