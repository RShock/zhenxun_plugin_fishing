<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px;
    background: radial-gradient(circle at 50% 0%, #1b2a4a 0%, #0c1220 70%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #dbe6ff;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 2px; }
  .stage {
    width: min(960px, 96vw); border-radius: 18px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    background: #bfe7ff;
  }
  svg { display: block; width: 100%; height: auto; }
  .panel { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    background: #2b4a80; color: #eaf2ff; border: 1px solid rgba(255,255,255,.18);
    padding: 8px 18px; border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #375c9c; }
  input[type=range] { width: 180px; accent-color: #6fb0ff; }
  .hint { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<h1>🐦 鹈鹕骑自行车</h1>

<div class="stage">
<svg id="scene" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fb8f2"/><stop offset="60%" stop-color="#a8e0fb"/><stop offset="100%" stop-color="#e4f6ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d6f78"/><stop offset="100%" stop-color="#3f424b"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="70%" stop-color="#e8eef6"/><stop offset="100%" stop-color="#c8d4e4"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc24d"/><stop offset="100%" stop-color="#ff9a1f"/>
    </linearGradient>
    <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/><stop offset="100%" stop-color="#ffd54a"/>
    </radialGradient>
    <clipPath id="frameClip"><rect x="0" y="0" width="900" height="500"/></clipPath>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="42" ry="24" fill="#fff" opacity=".92"/>
      <ellipse cx="34" cy="8" rx="30" ry="18" fill="#fff" opacity=".92"/>
      <ellipse cx="-34" cy="7" rx="26" ry="15" fill="#fff" opacity=".92"/>
    </g>

    <g id="wheel">
      <circle r="58" fill="none" stroke="#20242c" stroke-width="9"/>
      <circle r="52" fill="none" stroke="#454b57" stroke-width="2"/>
      <g stroke="#dfe4ec" stroke-width="2.2" opacity=".9">
        <line x1="0" y1="-50" x2="0" y2="50"/>
        <line x1="-50" y1="0" x2="50" y2="0"/>
        <line x1="-35" y1="-35" x2="35" y2="35"/>
        <line x1="-35" y1="35" x2="35" y2="-35"/>
        <line x1="-19" y1="-46" x2="19" y2="46"/>
        <line x1="19" y1="-46" x2="-19" y2="46"/>
        <line x1="-46" y1="-19" x2="46" y2="19"/>
        <line x1="46" y1="-19" x2="-46" y2="19"/>
      </g>
      <circle r="6" fill="#c9ced8" stroke="#2b2f38" stroke-width="2"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="900" height="500" fill="url(#sky)"/>
  <circle cx="770" cy="86" r="42" fill="url(#sunG)">
    <animate attributeName="r" values="42;45;42" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- 云 -->
  <g clip-path="url(#frameClip)">
    <use href="#cloud" x="0" y="0" transform="translate(980,90) scale(1.1)">
      <animateTransform attributeName="transform" type="translate" values="980,90;-120,90" dur="14s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#cloud" transform="translate(600,150)">
      <animateTransform attributeName="transform" type="translate" values="1060,0;-1060,0" dur="20s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#cloud" transform="translate(200,60) scale(.75)">
      <animateTransform attributeName="transform" type="translate" values="1300,0;-1300,0" dur="26s" repeatCount="indefinite" additive="sum"/>
    </use>
  </g>

  <!-- 远山 -->
  <g clip-path="url(#frameClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-900,0" dur="9s" repeatCount="indefinite"/>
      <g id="hills">
        <path d="M0 400 L120 300 L230 400 Z" fill="#7fb98a" opacity=".85"/>
        <path d="M180 400 L330 268 L470 400 Z" fill="#69a877" opacity=".9"/>
        <path d="M420 400 L560 310 L700 400 Z" fill="#7fb98a" opacity=".85"/>
        <path d="M650 400 L800 285 L940 400 Z" fill="#69a877" opacity=".9"/>
      </g>
      <use href="#hills" x="900"/>
    </g>
  </g>

  <!-- 草地 & 路 -->
  <rect y="392" width="900" height="20" fill="#8fd08a"/>
  <rect y="404" width="900" height="96" fill="url(#road)"/>
  <g clip-path="url(#frameClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-150,0" dur="0.55s" repeatCount="indefinite"/>
      <g fill="#f3e7a9">
        <rect x="0" y="446" width="80" height="7" rx="3"/>
        <rect x="150" y="446" width="80" height="7" rx="3"/>
        <rect x="300" y="446" width="80" height="7" rx="3"/>
        <rect x="450" y="446" width="80" height="7" rx="3"/>
        <rect x="600" y="446" width="80" height="7" rx="3"/>
        <rect x="750" y="446" width="80" height="7" rx="3"/>
        <rect x="900" y="446" width="80" height="7" rx="3"/>
      </g>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".55">
    <line x1="700" y1="250" x2="860" y2="250" stroke-width="4">
      <animate attributeName="opacity" values="0;.6;0" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="760;620" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="900;760" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="720" y1="320" x2="880" y2="320" stroke-width="3">
      <animate attributeName="opacity" values="0;.5;0" dur="0.62s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="780;640" dur="0.62s" begin="0.15s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="920;780" dur="0.62s" begin="0.15s" repeatCount="indefinite"/>
    </line>
    <line x1="690" y1="180" x2="820" y2="180" stroke-width="3">
      <animate attributeName="opacity" values="0;.45;0" dur="0.74s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="740;620" dur="0.74s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="880;760" dur="0.74s" begin="0.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============ 主体：整车 + 鹈鹕，一起轻微颠簸 ============ -->

    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3.5;0,0;0,-2;0,0" dur="1s" repeatCount="indefinite"/>

    <!-- 影子 -->
    <ellipse cx="450" cy="404" rx="150" ry="13" fill="#000" opacity=".22"/>

        <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
          keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="-64.2 0 0;-69.4 0 0;-75.0 0 0;-80.6 0 0;-85.6 0 0;-89.4 0 0;-91.4 0 0;-91.5 0 0;-89.7 0 0;-86.2 0 0;-81.4 0 0;-75.6 0 0;-69.3 0 0;-62.7 0 0;-56.5 0 0;-51.1 0 0;-47.4 0 0;-45.6 0 0;-45.6 0 0;-46.9 0 0;-49.1 0 0;-51.9 0 0;-55.4 0 0;-59.5 0 0;-64.2 0 0"/>
        <line x1="0" y1="0" x2="0" y2="46" stroke-width="13" stroke="#d99a34"/>
        <g transform="rotate(90.7 0 46)">
          <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
            keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="90.7 0 46;97.3 0 46;102.5 0 46;105.7 0 46;106.8 0 46;105.6 0 46;102.2 0 46;97.0 0 46;90.2 0 46;82.4 0 46;73.9 0 46;65.0 0 46;56.1 0 46;47.6 0 46;40.3 0 46;35.1 0 46;33.3 0 46;35.4 0 46;40.7 0 46;48.1 0 46;56.6 0 46;65.5 0 46;74.4 0 46;82.9 0 46;90.7 0 46"/>

    </g>

    <!-- 车轮 -->
    <g transform="translate(360,342)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
      <use href="#wheel"/>
    </g>
    <g transform="translate(540,342)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1s" repeatCount="indefinite" additive="sum"/>

    <!-- 链条 -->

    <circle cx="452" cy="316" r="20" fill="none" stroke="#9aa2b1" stroke-width="4" stroke-dasharray="4 4"/>

    <!-- 车架 -->

      <path d="M512 248 L452 316"/>

    </g>
    <!-- 车把 & 座垫 -->
    <g stroke="#2d3340" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M512 248 L516 224"/>
      <path d="M492 222 q24 -10 48 0"/>
      <path d="M492 222 l-12 12"/>
    </g>
    <path d="M374 252 q28 -14 54 -2 q-6 12 -28 12 q-20 0 -26 -10 Z" fill="#2d3340"/>

    <!-- 曲柄 + 踏板 -->
    <g>
      <animateTransform id="crank" attributeName="transform" type="rotate" from="0 452 316" to="360 452 316" dur="1s" repeatCount="indefinite"/>
      <line x1="452" y1="316" x2="469" y2="316" stroke="#c9ced8" stroke-width="7" stroke-linecap="round"/>
      <line x1="452" y1="316" x2="435" y2="316" stroke="#aeb4c0" stroke-width="7" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 469 316" to="-360 469 316" dur="1s" repeatCount="indefinite" additive="sum"/>
        <rect x="458" y="312" width="24" height="8" rx="3" fill="#2d3340"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 435 316" to="-360 435 316" dur="1s" repeatCount="indefinite" additive="sum"/>
        <rect x="423" y="312" width="24" height="8" rx="3" fill="#20242c"/>
      </g>
    </g>

    <!-- ============ 鹈鹕 ============ -->
    <g id="pelican">
      <!-- 尾羽 -->
      <g transform="translate(330,220)">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0;7 0 0;0 0 0;-5 0 0;0 0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
        <path d="M0 0 q-46 -6 -62 16 q34 6 44 18 q18 6 26 -4 Z" fill="#dfe7f1" stroke="#b9c5d6" stroke-width="2"/>
      </g>

      <!-- 身体 -->
      <path d="M338 232 q-6 -66 62 -84 q78 -20 112 26 q28 34 -6 62 q-44 34 -110 24 q-52 -8 -58 -28 Z"
            fill="url(#bodyG)" stroke="#a9b7c9" stroke-width="2.5"/>

      <path d="M352 236 q60 26 130 12 q-52 26 -112 14 q-16 -8 -18 -26 Z" fill="#c9d6e6" opacity=".55"/>

      <!-- 远侧翅膀 -->
      <g transform="translate(410,196)">
        <animateTransform attributeName="transform" type="rotate" values="6 0 0;-8 0 0;6 0 0" dur="1s" repeatCount="indefinite" additive="sum"/>
        <path d="M0 0 q-56 12 -70 44 q44 8 76 -8 q22 -12 12 -28 Z" fill="#c3cfde" stroke="#a3b1c4" stroke-width="2"/>
      </g>

      <!-- 脖子 + 头 (轻微点头) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 470 210;-3 470 210;0 470 210;2 470 210;0 470 210" dur="1s" repeatCount="indefinite"/>
        <path d="M470 214 q-8 -54 22 -76 q28 -20 50 4 q-30 8 -34 34 q-4 24 6 42 Z" fill="url(#bodyG)" stroke="#a9b7c9" stroke-width="2.5"/>
        <!-- 头 -->
        <ellipse cx="528" cy="134" rx="30" ry="27" fill="#ffffff" stroke="#a9b7c9" stroke-width="2.5"/>
        <path d="M506 114 q18 -22 40 -8 q-22 -2 -40 8 Z" fill="#ffd9e3"/>
        <!-- 眼睛（眨眼） -->
        <g>
          <circle cx="538" cy="126" r="5.2" fill="#232a35"/>
          <circle cx="539.8" cy="124.2" r="1.7" fill="#fff"/>
          <rect x="531" y="120" width="15" height="0" fill="#ffffff" stroke="#a9b7c9" stroke-width="1.5">
            <animate attributeName="height" values="0;0;0;11;0" keyTimes="0;0.86;0.9;0.94;1" dur="4s" repeatCount="indefinite"/>
          </rect>
        </g>
        <!-- 喙 + 喉囊 -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 552 140;2.5 552 140;0 552 140" dur="2s" repeatCount="indefinite"/>
          <path d="M552 128 q66 4 96 16 q-30 12 -96 8 Z" fill="url(#beakG)" stroke="#e08a13" stroke-width="2"/>
          <path d="M552 144 q44 4 82 4 q-16 34 -54 30 q-30 -4 -28 -34 Z" fill="#ffb84d" stroke="#e08a13" stroke-width="2"/>
          <!-- 喉囊里的小鱼 -->
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 600 152;-14 600 152;0 600 152;12 600 152;0 600 152" dur="1.4s" repeatCount="indefinite"/>
            <path d="M600 152 l22 -12 l-2 24 Z" fill="#4fb6e8" stroke="#2c8fc4" stroke-width="2"/>
          </g>
        </g>
      </g>

      <!-- 近侧翅膀：搭在车把上 -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 424 200;-2.5 424 200;0 424 200;1.5 424 200;0 424 200" dur="1s" repeatCount="indefinite"/>
        <path d="M424 200 q54 -6 84 20 q6 10 -6 14 q-16 4 -30 -8 q-30 -6 -48 -12 Z" fill="#dde7f4" stroke="#8fa0b6" stroke-width="2.5"/>
        <g stroke="#b3c2d4" stroke-width="1.8" fill="none" stroke-linecap="round">
          <path d="M436 202 q26 4 44 20"/>
          <path d="M448 208 q22 4 38 18"/>
          <path d="M462 214 q16 4 28 14"/>
        </g>
        <path d="M498 222 q16 -4 20 6 q-4 10 -20 6 Z" fill="#cbd8e8" stroke="#8fa0b6" stroke-width="2"/>
      </g>
    </g>

    <!-- 车铃 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 532 232;8 532 232;0 532 232;-8 532 232;0 532 232" dur="1s" repeatCount="indefinite"/>
      <circle cx="532" cy="233" r="7.5" fill="#ffd54a" stroke="#c99a10" stroke-width="2"/>
      <circle cx="534" cy="231" r="2" fill="#fff6c9"/>
    </g>

    <!-- 近侧腿（在车架前面） -->
    <g transform="translate(415,253)" fill="none" stroke-linecap="round">
      <g transform="rotate(-69.3 0 0)">
        <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
          keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="-69.3 0 0;-62.7 0 0;-56.5 0 0;-51.1 0 0;-47.4 0 0;-45.6 0 0;-45.6 0 0;-46.9 0 0;-49.1 0 0;-51.9 0 0;-55.4 0 0;-59.5 0 0;-64.2 0 0;-69.4 0 0;-75.0 0 0;-80.6 0 0;-85.6 0 0;-89.4 0 0;-91.4 0 0;-91.5 0 0;-89.7 0 0;-86.2 0 0;-81.4 0 0;-75.6 0 0;-69.3 0 0"/>
        <line x1="0" y1="0" x2="0" y2="46" stroke-width="15" stroke="#f2b94f"/>
        <g transform="rotate(56.1 0 46)">
          <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
            keyTimes="0.0000;0.0417;0.0833;0.1250;0.1667;0.2083;0.2500;0.2917;0.3333;0.3750;0.4167;0.4583;0.5000;0.5417;0.5833;0.6250;0.6667;0.7083;0.7500;0.7917;0.8333;0.8750;0.9167;0.9583;1.0000" values="56.1 0 46;47.6 0 46;40.3 0 46;35.1 0 46;33.3 0 46;35.4 0 46;40.7 0 46;48.1 0 46;56.6 0 46;65.5 0 46;74.4 0 46;82.9 0 46;90.7 0 46;97.3 0 46;102.5 0 46;105.7 0 46;106.8 0 46;105.6 0 46;102.2 0 46;97.0 0 46;90.2 0 46;82.4 0 46;73.9 0 46;65.0 0 46;56.1 0 46"/>
          <line x1="0" y1="46" x2="0" y2="94" stroke-width="9" stroke="#ffc964"/>
          <circle cx="0" cy="46" r="6" fill="#f2b94f"/>
          <path d="M-11 94 h24" stroke="#e0951f" stroke-width="8"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 前景草丛 -->
  <g clip-path="url(#frameClip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-300,0" dur="0.9s" repeatCount="indefinite"/>
      <g fill="#4f9a56" opacity=".9">
        <path d="M0 500 q14 -40 28 0 Z"/><path d="M120 500 q16 -48 32 0 Z"/><path d="M250 500 q12 -34 24 0 Z"/>
        <path d="M300 500 q14 -40 28 0 Z"/><path d="M420 500 q16 -48 32 0 Z"/><path d="M550 500 q12 -34 24 0 Z"/>
        <path d="M600 500 q14 -40 28 0 Z"/><path d="M720 500 q16 -48 32 0 Z"/><path d="M850 500 q12 -34 24 0 Z"/>
        <path d="M900 500 q14 -40 28 0 Z"/><path d="M1020 500 q16 -48 32 0 Z"/><path d="M1150 500 q12 -34 24 0 Z"/>
      </g>
    </g>
  </g>
</svg>
</div>

<div class="panel">
  <button id="toggle">⏸ 暂停</button>
  <label>速度 <input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="1"></label>
  <span id="speedVal">1.00x</span>
</div>
<p class="hint">纯 SVG + SMIL 动画，无任何图片与外部依赖 · 双腿踩踏由两段式 IK 逐帧解算</p>

<script>
  const svg = document.getElementById('scene');
  const anims = [...svg.querySelectorAll('animate, animateTransform')];
  anims.forEach(a => {
    a.dataset.dur = a.getAttribute('dur');
    if (a.hasAttribute('begin')) a.dataset.begin = a.getAttribute('begin');
  });

  const speed = document.getElementById('speed');
  const speedVal = document.getElementById('speedVal');
  const parseSec = s => parseFloat(s) * (s.trim().endsWith('ms') ? 0.001 : 1);

  function applySpeed(k) {
    const t = svg.getCurrentTime();
    anims.forEach(a => {
      a.setAttribute('dur', (parseSec(a.dataset.dur) / k).toFixed(4) + 's');
      if (a.dataset.begin) a.setAttribute('begin', (parseSec(a.dataset.begin) / k).toFixed(4) + 's');
    });
    svg.setCurrentTime(t);
    speedVal.textContent = k.toFixed(2) + 'x';
  }
  speed.addEventListener('input', () => applySpeed(parseFloat(speed.value)));

  const toggle = document.getElementById('toggle');
  let playing = true;
  toggle.addEventListener('click', () => {
    playing = !playing;
    playing ? svg.unpauseAnimations() : svg.pauseAnimations();
    toggle.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });
</script>
</body>
</html>
